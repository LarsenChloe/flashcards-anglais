var fcDeck = [], fcIdx = 0, fcFlipped = false, fcScores = {}, fcMode = 'en';

var fcFichesSel = document.getElementById('sel-fiche');
var fiches = [];
ALL.forEach(function(d) { if (fiches.indexOf(d.fiche) < 0) fiches.push(d.fiche); });
fcFichesSel.innerHTML = '<option value="all">Toutes les fiches (' + ALL.length + ')</option>';
fiches.forEach(function(f) {
  var theme = ALL.find(function(d) { return d.fiche === f; }).theme;
  var o = document.createElement('option');
  o.value = f; o.textContent = f + ' — ' + theme;
  fcFichesSel.appendChild(o);
});
fcFichesSel.addEventListener('change', fcBuildDeck);

function fcBuildDeck() {
  var fv = fcFichesSel.value;
  var base = fv === 'all' ? ALL : ALL.filter(function(d) { return d.fiche === fv; });
  var filt = document.getElementById('sel-filter').value;
  if (filt === 'todo') base = base.filter(function(d) { return fcScores[d.en + d.fr] !== true; });
  if (filt === 'ok') base = base.filter(function(d) { return fcScores[d.en + d.fr] === true; });
  fcDeck = base.slice();
  fcIdx = 0; fcFlipped = false;
  fcUpdateStats(); fcRender();
}

function fcShuffle() {
  for (var i = fcDeck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = fcDeck[i]; fcDeck[i] = fcDeck[j]; fcDeck[j] = tmp;
  }
  fcIdx = 0; fcFlipped = false; fcRender();
}

function fcResetScores() { fcScores = {}; fcBuildDeck(); }

function fcRender() {
  if (!fcDeck.length) {
    document.getElementById('fc-word').textContent = 'Aucune carte.';
    document.getElementById('fc-theme').textContent = '';
    document.getElementById('fc-hint').textContent = '';
    document.getElementById('fc-answer').style.display = 'none';
    document.getElementById('fc-vote').style.display = 'none';
    document.getElementById('fc-nav-info').textContent = '0 / 0';
    document.getElementById('fc-pbar').style.width = '0%';
    document.getElementById('fc-spk-q').style.display = 'none';
    document.getElementById('fc-spk-a').style.display = 'none';
    return;
  }
  var card = fcDeck[fcIdx];
  var mv = document.getElementById('sel-mode').value;
  fcMode = mv === 'rand' ? (Math.random() > 0.5 ? 'en' : 'fr') : mv;
  var q = fcMode === 'en' ? card.en : card.fr;
  var a = fcMode === 'en' ? card.fr : card.en;
  document.getElementById('fc-theme').textContent = card.fiche + ' · ' + card.theme;
  document.getElementById('fc-word').textContent = q;
  document.getElementById('fc-hint').textContent = fcFlipped ? '' : '— toucher pour retourner —';
  document.getElementById('fc-answer').style.display = fcFlipped ? 'block' : 'none';
  document.getElementById('fc-fr').textContent = a;
  document.getElementById('fc-ex').textContent = card.ex;
  document.getElementById('fc-spk-q').style.display = fcMode === 'en' ? 'inline-block' : 'none';
  document.getElementById('fc-spk-a').style.display = fcMode === 'fr' ? 'inline-block' : 'none';
  document.getElementById('fc-nav-info').textContent = (fcIdx + 1) + ' / ' + fcDeck.length;
  document.getElementById('fc-vote').style.display = fcFlipped ? 'flex' : 'none';
  document.getElementById('fc-pbar').style.width = Math.round((fcIdx + 1) / fcDeck.length * 100) + '%';
}

function fcFlip() { if (!fcDeck.length) return; fcFlipped = !fcFlipped; fcRender(); }
function fcGo(dir) { if (!fcDeck.length) return; fcIdx = (fcIdx + dir + fcDeck.length) % fcDeck.length; fcFlipped = false; fcRender(); }
function fcVote(ok) {
  if (!fcDeck.length) return;
  var card = fcDeck[fcIdx];
  fcScores[card.en + card.fr] = ok;
  fcUpdateStats();
  if (ok && document.getElementById('sel-filter').value === 'todo') {
    fcDeck.splice(fcIdx, 1);
    if (fcIdx >= fcDeck.length) fcIdx = 0;
    fcFlipped = false; fcRender();
  } else { fcGo(1); }
}
function fcUpdateStats() {
  var fv = fcFichesSel.value;
  var base = fv === 'all' ? ALL : ALL.filter(function(d) { return d.fiche === fv; });
  var ok = base.filter(function(d) { return fcScores[d.en + d.fr] === true; }).length;
  var ko = base.filter(function(d) { return fcScores[d.en + d.fr] === false; }).length;
  document.getElementById('fc-s-total').textContent = base.length;
  document.getElementById('fc-s-ok').textContent = ok;
  document.getElementById('fc-s-ko').textContent = ko;
  var rated = ok + ko;
  document.getElementById('fc-s-pct').textContent = rated > 0 ? Math.round(ok / rated * 100) + '%' : '—';
}
function fcSave() {
  var ok = Object.values(fcScores).filter(function(v) { return v === true; }).length;
  var ko = Object.values(fcScores).filter(function(v) { return v === false; }).length;
  var data = { version: 2, prenom: 'Larsen', date: new Date().toISOString(), scores: fcScores, summary: { total: ALL.length, sus: ok, arevoir: ko } };
  var a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
  a.download = 'anglais_larsen_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('Sauvegardé !');
}
function fcLoad(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try { var d = JSON.parse(ev.target.result); fcScores = d.scores || {}; fcBuildDeck(); showToast('Chargé !'); }
    catch(err) { showToast('Fichier invalide.'); }
  };
  r.readAsText(f);
  e.target.value = '';
}

var exDeck = [], exIdx = 0, exScores = {}, exAnswered = false, exInited = false;

function exInit() {
  var cats = [];
  GRAMMAR.forEach(function(g) { if (cats.indexOf(g.cat) < 0) cats.push(g.cat); });
  var sel = document.getElementById('ex-cat');
  sel.innerHTML = '<option value="all">Toutes les catégories</option>';
  cats.forEach(function(c) {
    var o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  exBuild();
}

function exBuild() {
  var cat = document.getElementById('ex-cat').value;
  var type = document.getElementById('ex-type').value;
  var base = cat === 'all' ? GRAMMAR : GRAMMAR.filter(function(g) { return g.cat === cat; });
  if (type !== 'all') base = base.filter(function(g) { return g.type === type; });
  exDeck = base.slice();
  exIdx = 0; exAnswered = false; exScores = {};
  exUpdateStats(); exRender();
}

function exShuffle() {
  for (var i = exDeck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = exDeck[i]; exDeck[i] = exDeck[j]; exDeck[j] = tmp;
  }
  exIdx = 0; exAnswered = false; exRender();
}

function exReset() { exScores = {}; exIdx = 0; exAnswered = false; exBuild(); }

function exRender() {
  if (!exDeck.length) return;
  var ex = exDeck[exIdx];
  exAnswered = false;
  document.getElementById('ex-cat-tag').textContent = ex.cat;
  document.getElementById('ex-num').textContent = (exIdx + 1) + ' / ' + exDeck.length;
  document.getElementById('ex-nav-info').textContent = (exIdx + 1) + ' / ' + exDeck.length;
  document.getElementById('ex-next-btn').style.display = 'none';
  document.getElementById('ex-feedback').style.display = 'none';
  document.getElementById('ex-question').textContent = ex.q;
  document.getElementById('ex-pbar').style.width = Math.round((exIdx + 1) / exDeck.length * 100) + '%';

  if (ex.type === 'qcm') {
    document.getElementById('ex-choices').style.display = 'grid';
    document.getElementById('ex-trou-wrap').style.display = 'none';
    var choicesEl = document.getElementById('ex-choices');
    choicesEl.innerHTML = '';
    ex.choices.forEach(function(c, i) {
      var btn = document.createElement('button');
      btn.className = 'ex-choice-btn';
      btn.textContent = c;
      btn.setAttribute('data-idx', i);
      btn.onclick = function() { exCheckQCM(i); };
      choicesEl.appendChild(btn);
    });
  } else {
    document.getElementById('ex-choices').style.display = 'none';
    document.getElementById('ex-trou-wrap').style.display = 'flex';
    var inp = document.getElementById('ex-trou-input');
    inp.value = '';
    inp.disabled = false;
    inp.style.borderColor = '#ccc';
    inp.style.background = 'white';
    setTimeout(function() { inp.focus(); }, 150);
  }
}

function exCheckQCM(choiceIdx) {
  if (exAnswered) return;
  exAnswered = true;
  var ex = exDeck[exIdx];
  var correct = choiceIdx === ex.a;
  exScores[exIdx] = correct;
  var btns = document.querySelectorAll('.ex-choice-btn');
  btns.forEach(function(b, i) {
    b.disabled = true;
    if (i === ex.a) b.classList.add('ex-correct');
    else if (i === choiceIdx && !correct) b.classList.add('ex-wrong');
  });
  exShowFeedback(correct, ex.choices[ex.a], ex.tip);
  exUpdateStats();
}

function exCheckTrou() {
  if (exAnswered) return;
  var ex = exDeck[exIdx];
  var inp = document.getElementById('ex-trou-input');
  var val = inp.value.trim().toLowerCase();
  var correct = val === ex.a.toLowerCase();
  exScores[exIdx] = correct;
  exAnswered = true;
  inp.disabled = true;
  inp.style.borderColor = correct ? '#86efac' : '#fca5a5';
  inp.style.background = correct ? '#f0fdf4' : '#fef2f2';
  exShowFeedback(correct, ex.a, ex.tip);
  exUpdateStats();
}

document.getElementById('ex-trou-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') exCheckTrou();
});

function exShowFeedback(correct, answer, tip) {
  var fb = document.getElementById('ex-feedback');
  var res = document.getElementById('ex-feedback-result');
  var tipEl = document.getElementById('ex-feedback-tip');
  fb.style.display = 'block';
  res.textContent = correct ? 'Correct !' : 'Réponse : ' + answer;
  res.className = 'ex-feedback-result ' + (correct ? 'result-ok' : 'result-ko');
  tipEl.textContent = tip || '';
  document.getElementById('ex-next-btn').style.display = 'inline-block';
}

function exGo(dir) {

// ===== DÉFI VOCABULAIRE =====
var defiPool = [], defiShuffled = [], defiIdx = 0;
var defiStreak = 0, defiRecord = 0, defiOk = 0, defiKo = 0;
var defiAnswered = false, defiInited = false, defiMode = 'en';

function defiInitTab() {
  if (defiInited) return;
  defiInited = true;
  var sel = document.getElementById('defi-fiche');
  sel.innerHTML = '<option value="all">Toutes les fiches</option>';
  fiches.forEach(function(f) {
    var theme = ALL.find(function(d) { return d.fiche === f; }).theme;
    var o = document.createElement('option');
    o.value = f; o.textContent = f + ' — ' + theme;
    sel.appendChild(o);
  });
  defiBuild();
}

function defiBuild() {
  var fv = document.getElementById('defi-fiche').value;
  defiPool = fv === 'all' ? ALL.slice() : ALL.filter(function(d) { return d.fiche === fv; });
  // Shuffle pool
  for (var i = defiPool.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = defiPool[i]; defiPool[i] = defiPool[j]; defiPool[j] = tmp;
  }
  defiShuffled = defiPool.slice();
  defiIdx = 0; defiStreak = 0; defiOk = 0; defiKo = 0;
  defiUpdateStats();
  document.getElementById('defi-start-btn').style.display = 'block';
  document.getElementById('defi-restart-btn').style.display = 'none';
  document.getElementById('defi-next-btn').style.display = 'none';
  document.getElementById('defi-fixed-bar').style.display = 'none';
  document.getElementById('defi-feedback').style.display = 'none';
  document.getElementById('defi-choices').innerHTML = '';
  document.getElementById('defi-question').textContent = 'Prêt ? Lance le défi !';
  document.getElementById('defi-fiche-tag').textContent = '';
}

function defiStart() {
  defiBuild();
  document.getElementById('defi-start-btn').style.display = 'none';
  document.getElementById('defi-restart-btn').style.display = 'none';
  document.getElementById('defi-fixed-bar').style.display = 'none';
  document.getElementById('defi-g-left').style.display = 'block';
  document.getElementById('defi-g-right').style.display = 'block';
  document.getElementById('defi-streak-display').style.display = 'block';
  document.getElementById('defi-streak-label').style.display = 'block';
  drawHermes(document.getElementById('defi-g-left'), 'idle');
  drawPhilo(document.getElementById('defi-g-right'), 'idle');
  defiRender();
}

function defiRender() {
  if (defiIdx >= defiShuffled.length) {
    defiShuffled = defiPool.slice();
    for (var i = defiShuffled.length-1; i>0; i--) {
      var j = Math.floor(Math.random()*(i+1));
      var tmp = defiShuffled[i]; defiShuffled[i] = defiShuffled[j]; defiShuffled[j] = tmp;
    }
    defiIdx = 0;
  }
  var card = defiShuffled[defiIdx];
  var mv = document.getElementById('defi-mode').value;
  defiMode = mv === 'rand' ? (Math.random() > 0.5 ? 'en' : 'fr') : mv;
  var q = defiMode === 'en' ? card.en : card.fr;
  var correct = defiMode === 'en' ? card.fr : card.en;

  document.getElementById('defi-fiche-tag').textContent = card.fiche + ' · ' + card.theme;
  document.getElementById('defi-question').textContent = q;
  document.getElementById('defi-next-btn').style.display = 'none';
  document.getElementById('defi-fixed-bar').style.display = 'none';
  document.getElementById('defi-feedback').style.display = 'none';
  defiAnswered = false;
  var gl = document.getElementById('defi-g-left');
  var gr = document.getElementById('defi-g-right');
  if (gl.style.display !== 'none') { drawHermes(gl, 'idle'); drawPhilo(gr, 'idle'); }

  // Build 4 choices: 1 correct + 3 random wrong
  var wrong = [];
  var pool = defiPool.slice();
  for (var i = pool.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  pool.forEach(function(c) {
    var cval = defiMode === 'en' ? c.fr : c.en;
    if (cval !== correct && wrong.length < 3) wrong.push(cval);
  });
  while (wrong.length < 3) wrong.push('—');

  var choices = [correct, wrong[0], wrong[1], wrong[2]];
  // Shuffle choices
  for (var i = choices.length-1; i>0; i--) {
    var j = Math.floor(Math.random()*(i+1));
    var tmp = choices[i]; choices[i] = choices[j]; choices[j] = tmp;
  }

  var el = document.getElementById('defi-choices');
  el.innerHTML = '';
  choices.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'ex-choice-btn';
    btn.textContent = c;
    btn.onclick = (function(val) { return function() { defiCheck(val, correct, card); }; })(c);
    el.appendChild(btn);
  });
}

function defiCheck(chosen, correct, card) {
  if (defiAnswered) return;
  defiAnswered = true;
  var ok = chosen === correct;
  var btns = document.querySelectorAll('#defi-choices .ex-choice-btn');
  btns.forEach(function(b) {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add('ex-correct');
    else if (b.textContent === chosen && !ok) b.classList.add('ex-wrong');
  });
  var fb = document.getElementById('defi-feedback');
  var res = document.getElementById('defi-feedback-result');
  var tip = document.getElementById('defi-feedback-tip');
  fb.style.display = 'block';
  tip.textContent = card.ex || '';
  if (ok) {
    defiStreak++; defiOk++;
    if (defiStreak > defiRecord) defiRecord = defiStreak;
    res.textContent = 'Correct ! Série : ' + defiStreak;
    res.className = 'ex-feedback-result result-ok';
    defiUpdateStats();
    document.getElementById('defi-streak-display').textContent = defiStreak;
    drawHermes(document.getElementById('defi-g-left'), 'happy');
    drawPhilo(document.getElementById('defi-g-right'), 'happy');
    document.getElementById('defi-next-btn').style.display = 'block';
    document.getElementById('defi-restart-btn').style.display = 'none';
    document.getElementById('defi-fixed-bar').style.display = 'block';
  } else {
    defiKo++;
    res.textContent = 'Raté ! Réponse : ' + correct + ' — Record : ' + defiRecord;
    res.className = 'ex-feedback-result result-ko';
    defiStreak = 0;
    defiUpdateStats();
    document.getElementById('defi-streak-display').textContent = 0;
    drawHermes(document.getElementById('defi-g-left'), 'sad');
    drawPhilo(document.getElementById('defi-g-right'), 'sad');
    document.getElementById('defi-next-btn').style.display = 'none';
    document.getElementById('defi-restart-btn').style.display = 'block';
    document.getElementById('defi-fixed-bar').style.display = 'block';
  }
}

function defiNext() {
  defiIdx++;
  defiRender();
}

function defiUpdateStats() {
  document.getElementById('defi-s-streak').textContent = defiStreak;
  document.getElementById('defi-s-record').textContent = defiRecord;
  document.getElementById('defi-s-ok').textContent = defiOk;
  document.getElementById('defi-s-ko').textContent = defiKo;
  var sd = document.getElementById('defi-streak-display');
  if (sd.style.display !== 'none') sd.textContent = defiStreak;
}

var spkPref = { acc: 'en-GB', slow: false };
try {
  var spkSaved = JSON.parse(localStorage.getItem('anglais_larsen_voix') || '{}');
  if (spkSaved.acc === 'en-US' || spkSaved.acc === 'en-GB') spkPref.acc = spkSaved.acc;
  if (spkSaved.slow === true) spkPref.slow = true;
} catch (e) {}
var spkVoices = [];
function spkLoad() {
  if (!('speechSynthesis' in window)) return;
  spkVoices = window.speechSynthesis.getVoices() || [];
}
if ('speechSynthesis' in window) {
  spkLoad();
  window.speechSynthesis.onvoiceschanged = spkLoad;
}
function spkPick() {
  var want = spkPref.acc.toLowerCase();
  var best = null;
  for (var i = 0; i < spkVoices.length; i++) {
    var lang = (spkVoices[i].lang || '').replace('_', '-').toLowerCase();
    if (lang === want) { if (!best || (spkVoices[i].localService && !best.localService)) best = spkVoices[i]; }
  }
  if (best) return best;
  for (var j = 0; j < spkVoices.length; j++) {
    if ((spkVoices[j].lang || '').toLowerCase().indexOf('en') === 0) return spkVoices[j];
  }
  return null;
}
function spkClean(t) {
  return String(t).replace(/\([^)]*\)/g, '').replace(/faux ami\s*:\s*/i, '').replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim();
}
function spkSay(text) {
  if (!('speechSynthesis' in window)) { showToast('Synthèse vocale indisponible'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(spkClean(text));
    var v = spkPick();
    if (v) u.voice = v;
    u.lang = spkPref.acc;
    u.rate = spkPref.slow ? 0.6 : 0.95;
    window.speechSynthesis.speak(u);
  } catch (e) { showToast('Lecture impossible'); }
}
function spkSavePref() {
  spkPref.acc = document.getElementById('sel-voix').value;
  spkPref.slow = document.getElementById('chk-lent').checked;
  try { localStorage.setItem('anglais_larsen_voix', JSON.stringify(spkPref)); } catch (e) {}
}
function fcSpeak(which) {
  if (!fcDeck.length) return;
  var card = fcDeck[fcIdx];
  spkSay(which === 'ex' ? card.ex : card.en);
}

function lcNorm(s) {
  s = String(s).toLowerCase().replace(/[\u2019\u2018`]/g, "'").trim();
  s = s.replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not')
       .replace(/\bwon't\b/g, 'will not').replace(/\bshan't\b/g, 'shall not');
  s = s.replace(/n't\b/g, ' not').replace(/'m\b/g, ' am').replace(/'re\b/g, ' are')
       .replace(/'ve\b/g, ' have').replace(/'ll\b/g, ' will');
  s = s.replace(/[.,!?;]+$/, '').replace(/\s+/g, ' ').trim();
  return s;
}
function lcMatch(input, accepted) {
  var n = lcNorm(input);
  var n2 = n.replace(/^(i|you|he|she|it|we|they) /, '');
  for (var i = 0; i < accepted.length; i++) {
    var a = lcNorm(accepted[i]);
    if (n === a || n2 === a) return true;
  }
  return false;
}

function lcRenderList() {
  var box = document.getElementById('lc-list');
  box.innerHTML = '';
  var gen = document.createElement('button');
  gen.className = 'lc-item lc-general';
  gen.onclick = function () { showTab('ex'); };
  gen.innerHTML = '<span class="lc-num">&#9733;</span><span class="lc-ttl">Exercices de grammaire (révision générale)<span class="lc-gsub">Toutes catégories mélangées · QCM et textes à trou</span></span><span class="lc-st">' + GRAMMAR.length + '</span>';
  box.appendChild(gen);
  var avail = 0, lastLevel = '';
  CURRICULUM.forEach(function (c, i) {
    if (c.l !== lastLevel) {
      var h = document.createElement('div');
      h.className = 'lc-level';
      h.textContent = 'Niveau ' + c.l;
      box.appendChild(h);
      lastLevel = c.l;
    }
    var L = lcFind(c.id);
    var row = document.createElement('button');
    row.className = 'lc-item' + (L ? '' : ' soon');
    var status = 'À venir', pct = 0;
    if (L) {
      avail++;
      var st = lcGetSt(c.id), ok = 0;
      for (var k = 0; k < L.ex.length; k++) if (st.res[k] === 1) ok++;
      status = ok + ' / ' + L.ex.length;
      pct = Math.round(ok / L.ex.length * 100);
      row.onclick = function () { lcOpen(c.id); };
    } else {
      row.disabled = true;
    }
    row.innerHTML = '<span class="lc-num">' + (i + 1) + '</span><span class="lc-ttl">' + lcEsc(c.t) +
      '</span><span class="lc-st">' + status + '</span>' +
      (L ? '<span class="lc-bar"><span style="width:' + pct + '%"></span></span>' : '');
    box.appendChild(row);
  });
  document.getElementById('lc-sub').textContent = avail + ' leçon' + (avail > 1 ? 's' : '') + ' disponible' + (avail > 1 ? 's' : '') + ' sur ' + CURRICULUM.length + ' · cours détaillé + 50 exercices chacune, plus une révision générale';
}

function lcOpen(id) {
  var L = lcFind(id);
  if (!L) return;
  lcCur = L; lcSess = null;
  document.getElementById('lc-list-view').style.display = 'none';
  document.getElementById('lc-lesson-view').style.display = 'block';
  document.getElementById('lc-title').textContent = L.title;
  document.getElementById('lc-badge').textContent = 'Niveau ' + L.level;
  document.getElementById('lc-course').innerHTML = L.course;
  lcShowPane('course');
  window.scrollTo(0, 0);
}
function lcBack() {
  document.getElementById('lc-fixed-bar').style.display = 'none';
  document.getElementById('lc-lesson-view').style.display = 'none';
  document.getElementById('lc-list-view').style.display = 'block';
  lcCur = null; lcSess = null;
  lcRenderList();
  window.scrollTo(0, 0);
}
function lcShowPane(p) {
  document.getElementById('lc-course').style.display = p === 'course' ? 'block' : 'none';
  document.getElementById('lc-ex').style.display = p === 'ex' ? 'block' : 'none';
  document.getElementById('lc-tab-course').classList.toggle('active', p === 'course');
  document.getElementById('lc-tab-ex').classList.toggle('active', p === 'ex');
  document.getElementById('lc-fixed-bar').style.display = 'none';
  if (p === 'ex') lcRenderStart();
  window.scrollTo(0, 0);
}

function lcCounts() {
  var st = lcGetSt(lcCur.id), ok = 0, ko = 0;
  for (var i = 0; i < lcCur.ex.length; i++) {
    if (st.res[i] === 1) ok++; else if (st.res[i] === 0) ko++;
  }
  return { ok: ok, ko: ko, todo: lcCur.ex.length - ok, n: lcCur.ex.length };
}

function lcRenderStart() {
  lcSess = null;
  var c = lcCounts();
  var pane = document.getElementById('lc-ex');
  var h = '<div class="ex-card"><div class="ex-cat-tag">' + lcEsc(lcCur.title) + '</div>' +
    '<div class="stats" style="margin-top:10px">' +
    '<div class="stat"><div class="stat-n">' + c.n + '</div><div class="stat-l">exercices</div></div>' +
    '<div class="stat"><div class="stat-n ok-n">' + c.ok + '</div><div class="stat-l">réussis</div></div>' +
    '<div class="stat"><div class="stat-n ko-n">' + c.ko + '</div><div class="stat-l">ratés</div></div>' +
    '<div class="stat"><div class="stat-n">' + c.todo + '</div><div class="stat-l">à faire</div></div></div>' +
    '<p class="lc-hint">Complète avec la forme correcte du verbe entre parenthèses, auxiliaire inclus. Les contractions (don\'t, I\'m…) sont acceptées.</p>' +
    '<div class="lc-btn-col">' +
    '<button class="lc-main" onclick="lcStart(\'all\')">Commencer (' + c.n + ')</button>' +
    '<button onclick="lcStart(\'shuffle\')">Mélanger les ' + c.n + ' exercices</button>' +
    (c.ok > 0 && c.todo > 0 ? '<button onclick="lcStart(\'todo\')">Seulement les non réussis (' + c.todo + ')</button>' : '') +
    (c.ok + c.ko > 0 ? '<button class="btn-ko" onclick="lcReset()">Réinitialiser ma progression</button>' : '') +
    '</div></div>';
  pane.innerHTML = h;
}

function lcReset() {
  if (!confirm('Effacer la progression de cette leçon ?')) return;
  lcState[lcCur.id] = { res: {} };
  lcSaveState();
  lcRenderStart();
}

function lcStart(mode) {
  var st = lcGetSt(lcCur.id), items = [], i;
  for (i = 0; i < lcCur.ex.length; i++) {
    if (mode === 'todo' && st.res[i] === 1) continue;
    items.push(i);
  }
  if (mode === 'shuffle') lcShuffleArr(items);
  lcStartItems(items);
}
function lcStartItems(items) {
  if (!items.length) { showToast('Rien à refaire !'); return; }
  lcSess = { items: items, i: 0, ok: 0, ko: 0, wrong: [], answered: false, cur: null };
  lcRenderQ();
}

function lcRenderQ() {
  var s = lcSess;
  if (s.i >= s.items.length) { lcRenderSummary(); return; }
  var idx = s.items[s.i], e = lcCur.ex[idx], isQcm = Array.isArray(e[1]);
  var pane = document.getElementById('lc-ex');
  pane.innerHTML = '<div class="ex-card"><div class="ex-cat-tag">' + lcEsc(lcCur.title) + '</div>' +
    '<div class="ex-num" id="lc-num"></div><div class="ex-question" id="lc-q"></div>' +
    '<div id="lc-ans"></div><div id="lc-fb"></div></div><div style="height:90px"></div>';
  lcUpdateNum();
  document.getElementById('lc-q').textContent = e[0];
  var ans = document.getElementById('lc-ans');
  s.answered = false;
  if (isQcm) {
    var opts = e[1].map(function (t, k) { return { t: t, ok: k === e[2] }; });
    lcShuffleArr(opts);
    s.cur = { idx: idx, e: e, isQcm: true, opts: opts, btns: [] };
    opts.forEach(function (o, k) {
      var b = document.createElement('button');
      b.className = 'ex-choice-btn lc-choice';
      b.textContent = o.t;
      b.onclick = function () { lcAnswerQcm(k); };
      ans.appendChild(b);
      s.cur.btns.push(b);
    });
  } else {
    s.cur = { idx: idx, e: e, isQcm: false };
    ans.innerHTML = '<div class="ex-trou-wrap"><input type="text" class="ex-trou-input" id="lc-input" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" placeholder="Ta réponse">' +
      '<button class="ex-confirm-btn" id="lc-ok-btn" onclick="lcCheckTrou()">OK</button></div>';
    var inp = document.getElementById('lc-input');
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') lcCheckTrou(); });
  }
}
function lcUpdateNum() {
  var s = lcSess;
  document.getElementById('lc-num').textContent = 'Question ' + (s.i + 1) + ' / ' + s.items.length + '  ·  ✓ ' + s.ok + '  ✗ ' + s.ko;
}

function lcAnswerQcm(k) {
  var s = lcSess;
  if (s.answered) return;
  var c = s.cur, ok = c.opts[k].ok, goodText = '';
  c.btns.forEach(function (b, j) {
    b.disabled = true;
    if (c.opts[j].ok) { b.classList.add('ex-correct'); goodText = c.opts[j].t; }
  });
  if (!ok) c.btns[k].classList.add('ex-wrong');
  lcFeedback(ok, goodText, c.e[3]);
}
function lcCheckTrou() {
  var s = lcSess;
  if (s.answered) return;
  var inp = document.getElementById('lc-input');
  var v = inp.value;
  if (!v.trim()) return;
  var accepted = s.cur.e[1].split('|');
  var ok = lcMatch(v, accepted);
  inp.disabled = true;
  inp.blur();
  document.getElementById('lc-ok-btn').disabled = true;
  inp.style.borderColor = ok ? '#86efac' : '#fca5a5';
  lcFeedback(ok, accepted[0], s.cur.e[2]);
}
function lcFeedback(ok, goodText, tip) {
  var s = lcSess, st = lcGetSt(lcCur.id);
  s.answered = true;
  st.res[s.cur.idx] = ok ? 1 : 0;
  lcSaveState();
  if (ok) s.ok++; else { s.ko++; s.wrong.push(s.cur.idx); }
  lcUpdateNum();
  document.getElementById('lc-fb').innerHTML = '<div class="ex-feedback"><div class="ex-feedback-result ' + (ok ? 'result-ok' : 'result-ko') + '">' +
    (ok ? 'Correct ✓' : 'Faux ✗') + (ok && s.cur.isQcm ? '' : ' — Réponse : ' + lcEsc(goodText)) + '</div>' +
    '<div class="ex-feedback-tip">' + lcEsc(tip || '') + '</div></div>';
  var last = s.i >= s.items.length - 1;
  document.getElementById('lc-next-btn').textContent = last ? 'Voir le résultat' : 'Suivant →';
  document.getElementById('lc-fixed-bar').style.display = 'block';
}
function lcNext() {
  var s = lcSess;
  if (!s || !s.answered) return;
  s.i++;
  document.getElementById('lc-fixed-bar').style.display = 'none';
  lcRenderQ();
  window.scrollTo(0, 0);
}

function lcRenderSummary() {
  var s = lcSess, n = s.items.length;
  var pct = Math.round(s.ok / n * 100);
  var pane = document.getElementById('lc-ex');
  var wrongHtml = '';
  if (s.wrong.length) {
    wrongHtml = '<div class="lc-wrong"><div class="ex-cat-tag">À revoir</div>';
    s.wrong.forEach(function (idx) {
      var e = lcCur.ex[idx], ans;
      if (Array.isArray(e[1])) { ans = e[1][e[2]]; wrongHtml += '<div class="lc-w-item"><div>' + lcEsc(e[0]) + '</div><div class="result-ok">→ ' + lcEsc(ans) + '</div><div class="ex-feedback-tip">' + lcEsc(e[3] || '') + '</div></div>'; }
      else { ans = e[1].split('|')[0]; wrongHtml += '<div class="lc-w-item"><div>' + lcEsc(e[0]) + '</div><div class="result-ok">→ ' + lcEsc(ans) + '</div><div class="ex-feedback-tip">' + lcEsc(e[2] || '') + '</div></div>'; }
    });
    wrongHtml += '</div>';
  }
  var msg = pct >= 90 ? 'Excellent !' : pct >= 70 ? 'Bien joué.' : pct >= 50 ? 'Pas mal, à consolider.' : 'Relis le cours puis réessaie.';
  pane.innerHTML = '<div class="ex-card" style="text-align:center"><div class="ex-cat-tag">Résultat</div>' +
    '<div style="font-size:42px;font-weight:500;margin:6px 0">' + s.ok + ' / ' + n + '</div>' +
    '<div class="ex-feedback-tip" style="font-size:14px;margin-bottom:14px">' + pct + ' % · ' + msg + '</div>' +
    '<div class="lc-btn-col">' +
    (s.wrong.length ? '<button class="lc-main" onclick="lcStartItems(lcSess.wrong.slice())">Refaire les ' + s.wrong.length + ' erreurs</button>' : '') +
    '<button onclick="lcStart(\'shuffle\')">Tout refaire (mélangé)</button>' +
    '<button onclick="lcShowPane(\'course\')">Relire le cours</button>' +
    '<button onclick="lcBack()">← Toutes les leçons</button></div></div>' + wrongHtml + '<div style="height:20px"></div>';
  window.scrollTo(0, 0);
}
</script>
