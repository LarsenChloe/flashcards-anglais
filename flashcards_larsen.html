title: 'Present simple',
level: 'A1',
course: `
<h3>1. Quand l'utiliser ?</h3>
<p>Le present simple décrit ce qui est vrai <b>de façon générale ou répétée</b>, pas ce qui se passe « en ce moment ».</p>
<div class="lc-t"><table>
<tr><th>Usage</th><th>Exemple</th></tr>
<tr><td>Habitudes, routines</td><td>I take the bus every morning.</td></tr>
<tr><td>Faits permanents, vérités générales</td><td>Water boils at 100°C.</td></tr>
<tr><td>États : goûts, opinions, possession</td><td>She likes jazz. I know him. He has a car.</td></tr>
<tr><td>Horaires, programmes officiels (sens futur)</td><td>The train leaves at 7:45. The film starts at 8.</td></tr>
<tr><td>Instructions, directions</td><td>You turn left, then you go straight on.</td></tr>
<tr><td>Récits, commentaires, titres de presse</td><td>Prices rise again. Messi passes to Alvarez.</td></tr>
</table></div>

<h3>2. Forme affirmative</h3>
<p>On utilise la <b>forme de base</b> du verbe (sans <i>to</i>). À la 3<sup>e</sup> personne du singulier (he / she / it), on ajoute <b>-s</b>.</p>
<div class="lc-t"><table>
<tr><th></th><th>work</th><th>be</th><th>have</th></tr>
<tr><td>I</td><td>work</td><td>am</td><td>have</td></tr>
<tr><td>you</td><td>work</td><td>are</td><td>have</td></tr>
<tr><td>he / she / it</td><td><b>works</b></td><td><b>is</b></td><td><b>has</b></td></tr>
<tr><td>we / you / they</td><td>work</td><td>are</td><td>have</td></tr>
</table></div>

<h3>3. Orthographe de la 3<sup>e</sup> personne</h3>
<div class="lc-t"><table>
<tr><th>Règle</th><th>Exemples</th></tr>
<tr><td>Cas général : +s</td><td>work → works, eat → eats, live → lives</td></tr>
<tr><td>Verbes en -s, -ss, -sh, -ch, -x, -z, -o : +es</td><td>pass → passes, wash → washes, watch → watches, fix → fixes, go → goes, do → does</td></tr>
<tr><td>Consonne + y : y → ies</td><td>study → studies, cry → cries, carry → carries</td></tr>
<tr><td>Voyelle + y : +s</td><td>play → plays, buy → buys, enjoy → enjoys</td></tr>
<tr><td>Irrégulier</td><td>have → has</td></tr>
</table></div>

<h3>4. Négation</h3>
<div class="lc-box"><b>do not (don't) / does not (doesn't) + forme de base</b><br>
I don't like coffee. · She doesn't work here. · They don't live in Paris.</div>
<div class="lc-warn">Après <i>doesn't</i>, le verbe perd son -s : <i>She doesn't work</i> (et non <i>doesn't works</i>). Le -s est porté par l'auxiliaire, une seule fois.</div>
<p>Avec <i>be</i>, pas de do : <i>I am not tired. He isn't here. They aren't ready.</i></p>

<h3>5. Questions</h3>
<div class="lc-box"><b>Do / Does + sujet + forme de base ?</b><br>
Do you speak Spanish? · Does she live in Lyon? · Where do they work? · What time does the shop close?</div>
<p>Réponses courtes : <i>Yes, I do. / No, she doesn't.</i> (on répète l'auxiliaire, jamais le verbe).</p>
<p><b>Question sur le sujet</b> (Who, What, Which + verbe) : pas d'auxiliaire do, le verbe se met à la 3<sup>e</sup> personne : <i>Who lives here? What happens next?</i></p>

<h3>6. Adverbes de fréquence et expressions de temps</h3>
<p>always (100 %) · usually · often · sometimes · rarely / seldom · never (0 %).</p>
<div class="lc-box"><b>Place :</b> <u>avant</u> le verbe principal (<i>She often goes out</i>), <u>après</u> le verbe <i>be</i> (<i>He is always late</i>), après le premier auxiliaire (<i>I don't usually eat meat</i>).</div>
<p>Expressions : every day / week, on Mondays, at weekends, twice a week, once a month, from time to time.</p>
<p>Question de fréquence : <i>How often do you go to the gym? — Twice a week.</i></p>

<h3>7. Pièges classiques pour francophones</h3>
<div class="lc-warn">
✗ <i>I am agree</i> → ✓ <i>I agree</i> (agree est un verbe, pas un adjectif)<br>
✗ <i>Do you can swim?</i> → ✓ <i>Can you swim?</i> (pas de do avec les modaux)<br>
✗ <i>She don't like it</i> → ✓ <i>She doesn't like it</i><br>
✗ <i>Does she works?</i> → ✓ <i>Does she work?</i><br>
✗ <i>I am knowing / I am liking</i> → ✓ <i>I know / I like</i> (verbes d'état, voir leçon 2)<br>
✗ <i>I live here since 2010</i> → ✓ <i>I have lived here since 2010</i> (leçon 4)
</div>
`,

course: `
<h3>1. Forme</h3>
<div class="lc-box"><b>am / is / are + verbe en -ing</b><br>
I'm working. · She's reading. · They're waiting.</div>
<div class="lc-t"><table>
<tr><th></th><th>Affirmatif</th><th>Négatif</th><th>Question</th></tr>
<tr><td>I</td><td>I am working</td><td>I am not working</td><td>Am I working?</td></tr>
<tr><td>he / she / it</td><td>she is working</td><td>she isn't working</td><td>Is she working?</td></tr>
<tr><td>we / you / they</td><td>they are working</td><td>they aren't working</td><td>Are they working?</td></tr>
</table></div>
<p>Questions avec mot interrogatif : <i>What are you doing? Where is he going? Why are they laughing?</i></p>

<h3>2. Orthographe du -ing</h3>
<div class="lc-t"><table>
<tr><th>Règle</th><th>Exemples</th></tr>
<tr><td>Cas général : +ing</td><td>work → working, play → playing, study → studying</td></tr>
<tr><td>Verbe en -e muet : on supprime le e</td><td>make → making, write → writing, come → coming</td></tr>
<tr><td>Consonne + voyelle + consonne (mot court ou accent final) : on double la consonne</td><td>run → running, sit → sitting, stop → stopping, begin → beginning</td></tr>
<tr><td>Pas de doublement si l'accent n'est pas sur la dernière syllabe</td><td>visit → visiting, open → opening</td></tr>
<tr><td>-ie → -ying</td><td>lie → lying, die → dying, tie → tying</td></tr>
</table></div>

<h3>3. Quand l'utiliser ?</h3>
<div class="lc-t"><table>
<tr><th>Usage</th><th>Exemple</th></tr>
<tr><td>Action <b>en cours</b> au moment où l'on parle</td><td>Look! It's raining. Shh, the baby is sleeping.</td></tr>

<h3>1. Forme</h3>
<div class="lc-box"><b>was / were + verbe en -ing</b><br>

<p>L'orthographe du -ing est la même qu'au present continuous (make → making, run → running, lie → lying).</p>

<h3>2. Les usages</h3>
<div class="lc-t"><table>

<h3>1. L'anglais n'a pas un seul futur</h3>
<p>Le choix de la forme dépend de <b>l'attitude du locuteur</b> : décision prise sur le moment, plan, arrangement, prévision.</p>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Valeur principale</th><th>Exemple</th></tr>
<tr><td><b>will</b> + base</td><td>décision spontanée, promesse, offre, prévision / opinion</td><td>I'll answer it. I think it will rain.</td></tr>
<tr><td><b>be going to</b> + base</td><td>plan déjà décidé, prévision fondée sur une preuve</td><td>I'm going to learn Italian. Look at those clouds: it's going to rain.</td></tr>
<tr><td><b>present continuous</b></td><td>arrangement précis (heure, lieu, personnes)</td><td>I'm meeting Tom at 6 tomorrow.</td></tr>
<tr><td><b>present simple</b></td><td>horaire, programme officiel</td><td>The train leaves at 7:15.</td></tr>
</table></div>

<h3>2. Will</h3>
<div class="lc-box"><b>will + base</b> (jamais de -s) · négatif <b>won't</b> · question <b>Will you…?</b> · contraction <b>'ll</b><br>
I'll help you. · She won't come. · Will it be cold?</div>
<div class="lc-t"><table>
<tr><th>Usage</th><th>Exemple</th></tr>
<tr><td>Décision prise au moment de parler</td><td>— The phone's ringing. — I'll get it.</td></tr>
<tr><td>Promesse, offre, menace</td><td>I won't tell anyone. Don't worry, I'll carry it.</td></tr>
<tr><td>Prévision, opinion (I think, I expect, probably)</td><td>I think she'll get the job. It will probably rain.</td></tr>
<tr><td>Fait futur</td><td>The sun will rise at 6:12 tomorrow.</td></tr>
<tr><td>Demande</td><td>Will you help me, please?</td></tr>
</table></div>
<p><b>Shall</b> s'emploie avec I / we pour une proposition ou une suggestion : <i>Shall I open the window? Shall we go?</i></p>

<h3>3. Be going to</h3>
<div class="lc-box"><b>am / is / are going to + base</b><br>
I'm going to study law. · She isn't going to come. · What are you going to do tonight?</div>
<p>Deux emplois : <b>intention</b> décidée avant de parler (<i>I've decided: I'm going to quit</i>) et <b>prévision fondée sur ce qu'on voit</b> (<i>Watch out! You're going to fall!</i>).</p>

<div class="lc-warn">Après <i>when, as soon as, before, after, until, while, if</i>, on met le <b>present simple</b>, jamais will, même si le sens est futur.<br>

✗ <i>If it will rain, we'll stay home</i> → ✓ <i>If it rains, we'll stay home</i></div>

<h3>5. Place des adverbes</h3>
<p><i>probably, definitely, certainly</i> se placent <b>entre will et le verbe</b> (<i>It will probably rain</i>) mais <b>avant won't</b> (<i>It probably won't rain</i>).</p>

course: `
<h3>1. Vue d'ensemble</h3>
<div class="lc-t"><table>
<tr><th>Quantifieur</th><th>+ dénombrable pluriel</th><th>+ indénombrable</th></tr>
<tr><td>some / any</td><td>some books · any books</td><td>some water · any water</td></tr>
<tr><td>many / much</td><td><b>many</b> friends</td><td><b>much</b> time</td></tr>

<tr><td>a little / little</td><td>—</td><td>a little time · little time</td></tr>
<tr><td>enough, plenty of, no</td><td>enough chairs</td><td>enough money</td></tr>
<tr><td>too many / too much</td><td>too many cars</td><td>too much noise</td></tr>
</table></div>

<h3>2. Some et any</h3>
<div class="lc-box"><b>some</b> : phrases affirmatives, et offres / demandes dont on attend « oui »<br>
I have some friends here. · Would you like <u>some</u> tea? · Can I have <u>some</u> water?<br><br>
<b>any</b> : négations et questions<br>
I don't have <u>any</u> money. · Do you have <u>any</u> questions?</div>
<p><b>any</b> en phrase affirmative = « n'importe quel » : <i>Any day is fine.</i> · <b>no</b> = <i>not any</i> : <i>I have no time = I don't have any time.</i></p>

<h3>3. Much, many, a lot of</h3>
<p><b>many</b> + dénombrable, <b>much</b> + indénombrable : surtout dans les <u>questions</u> (<i>How many…? How much…?</i>) et les <u>négations</u> (<i>not many, not much</i>).</p>
<p>En phrase affirmative, on préfère <b>a lot of / lots of</b> : <i>She has a lot of friends. He earns a lot of money.</i> (« She has much money » est très formel.)</p>

<h3>4. A few / few, a little / little</h3>
<div class="lc-box"><b>a few / a little</b> = <u>quelques, un peu</u> : sens <b>positif</b> (il y en a assez)<br>
<b>few / little</b> = <u>très peu, presque pas</u> : sens <b>négatif</b> (il n'y en a pas assez)</div>
<p><i>I have a few friends here</i> (j'en ai quelques-uns, ça va) · <i>I have few friends here</i> (presque aucun, je me sens seul).<br>
<i>There's a little milk left</i> (un peu) · <i>There's little hope</i> (presque aucun espoir).</p>

<h3>5. Enough, too much, too many</h3>
<p><b>enough</b> se place <u>avant le nom</u> (<i>enough time</i>) mais <u>après l'adjectif</u> (<i>old enough</i>). <b>too many</b> + dénombrable, <b>too much</b> + indénombrable : excès négatif.</p>

<h3>6. All, most, some, none · both, either, neither · each, every</h3>

<h3>2. Pronoms sujets et compléments</h3>
<p>Le pronom complément s'emploie après un verbe ou une préposition : <i>Help me. Give it to her. Between you and me. He is taller than me.</i></p>

<h3>3. L'adjectif possessif s'accorde avec le possesseur</h3>
<div class="lc-warn"><b>Piège majeur pour francophones.</b> En français, <i>son / sa / ses</i> s'accorde avec la chose possédée. En anglais, il s'accorde avec <b>la personne qui possède</b> :<br>
Tom loves <b>his</b> mother. · Maria loves <b>her</b> brother. · The dog wags <b>its</b> tail.<br>
<i>Son frère</i> = <i>his brother</i> (à lui) ou <i>her brother</i> (à elle).</div>
<p><b>its / it's</b> : <i>its</i> = possessif (<i>its tail</i>) · <i>it's</i> = it is / it has (<i>It's late</i>).</p>
<p>Devant les parties du corps et les vêtements, l'anglais utilise le possessif : <i>She washed her hands. He put on his coat.</i></p>

<h3>4. Pronoms possessifs</h3>
<p>Ils remplacent « adjectif + nom » : <i>This is my bag → This bag is mine.</i> Pas d'article, pas de nom : <i>Is this pen yours?</i> <i>A friend of mine called</i> (= un de mes amis).</p>

<h3>5. Le génitif 's</h3>
<div class="lc-t"><table>
<tr><th>Cas</th><th>Forme</th><th>Exemple</th></tr>
<tr><td>Singulier</td><td>'s</td><td>my sister's bike · the student's book</td></tr>
<tr><td>Pluriel en -s</td><td>s'</td><td>the students' room · my parents' house</td></tr>
<tr><td>Pluriel irrégulier</td><td>'s</td><td>the children's toys · women's rights</td></tr>
<tr><td>Choses</td><td>of</td><td>the end of the film · the door of the car</td></tr>
</table></div>

<h3>6. Les réfléchis</h3>
<p>Le pronom réfléchi s'emploie quand <b>sujet et complément sont la même personne</b> : <i>She cut herself. I taught myself to play the guitar. They enjoyed themselves.</i></p>
<p><b>Avec wash, shave, dress, get up</b>, le réfléchi est souvent omis : <i>He washed and got dressed.</i> Il est obligatoire avec <i>enjoy, hurt, cut, introduce, teach</i> dans ce sens.</p>
<p><b>By + réfléchi</b> = tout seul : <i>I live by myself. Do it yourself!</i></p>
<p><b>each other / one another</b> = l'un l'autre (réciproque) : <i>They looked at each other.</i> ≠ <i>They looked at themselves</i> (chacun se regarde).</p>

<h3>7. Démonstratifs</h3>
<div class="lc-t"><table>
<tr><th></th><th>Proche</th><th>Éloigné</th></tr>

<tr><td>Pluriel</td><td>these</td><td>those</td></tr>
</table></div>
<p><i>This is my phone. Look at those birds over there!</i> L'anglais utilise <b>it</b> comme sujet impersonnel : <i>It's raining. It's late. It's important to rest.</i></p>

<h3>1. Règles de base</h3>
<p>L'adjectif anglais est <b>invariable</b> (pas d'accord en genre ni en nombre) et se place <b>avant le nom</b> ou <b>après un verbe d'état</b> (be, seem, look, feel, sound, taste, become, get).</p>

<h3>2. Ordre des adjectifs</h3>
<p>Quand plusieurs adjectifs qualifient un nom, l'ordre naturel est :</p>
<div class="lc-box"><b>opinion → taille → âge → forme → couleur → origine → matière → usage → NOM</b></div>
<div class="lc-t"><table>
<tr><th>Exemple</th><th>Ordre</th></tr>
<tr><td>a <b>beautiful old</b> house</td><td>opinion + âge</td></tr>
<tr><td>a <b>big wooden</b> table</td><td>taille + matière</td></tr>
<tr><td>a <b>small red</b> car</td><td>taille + couleur</td></tr>
<tr><td>a <b>black Italian leather</b> bag</td><td>couleur + origine + matière</td></tr>
</table></div>

<h3>3. Adjectifs en -ed et -ing</h3>
<div class="lc-box"><b>-ing</b> = ce qui <u>provoque</u> le sentiment : <i>The film was boring.</i><br>
<b>-ed</b> = ce que <u>ressent</u> la personne : <i>I was bored.</i></div>
<p>bored / boring · interested / interesting · tired / tiring · excited / exciting · surprised / surprising · worried / worrying · confused / confusing.</p>

<h3>4. Le comparatif</h3>
<div class="lc-t"><table>
<tr><th>Adjectif</th><th>Règle</th><th>Exemples</th></tr>
<tr><td>1 syllabe</td><td>+ er</td><td>tall → taller · nice → nicer</td></tr>
<tr><td>1 syllabe CVC</td><td>consonne doublée</td><td>big → bigger · hot → hotter</td></tr>
<tr><td>2 syllabes en -y</td><td>y → ier</td><td>happy → happier · easy → easier</td></tr>
<tr><td>2 syllabes ou plus</td><td>more + adjectif</td><td>more expensive · more careful</td></tr>
<tr><td>Irréguliers</td><td></td><td>good → better · bad → worse · far → farther / further · little → less · much / many → more</td></tr>
</table></div>
<p>Comparaison : <b>than</b> (<i>taller than me</i>) · <b>as … as</b> (<i>as tall as</i>) · <b>not as … as</b> · <b>less … than</b>. Intensité : <i>much / far / a lot taller, slightly / a bit taller.</i></p>
<p>Progression : <i>The more I study, the more I learn.</i> · <i>It's getting colder and colder.</i></p>

<h3>5. Le superlatif</h3>
<div class="lc-box"><b>the + adjectif-est</b> (1 syllabe, -y → -iest) : the tallest, the happiest<br>
<b>the most + adjectif</b> (2 syllabes et plus) : the most expensive<br>
Irréguliers : the best, the worst, the furthest, the least, the most</div>
<p>Pour <b>deux</b> éléments, on utilise le comparatif : <i>She's the younger of the two.</i> Pour trois ou plus, le superlatif : <i>the youngest of the three.</i></p>
<p>Autres structures : <i>the same as, different from, similar to.</i></p>

✗ <i>as tall than</i> → ✓ <i>as tall as</i><br>
✗ <i>different of / than</i> → ✓ <i>different from</i> (britannique)
</div>

<h3>1. La règle d'or</h3>
<div class="lc-box"><b>Past simple</b> : l'action appartient à un passé <u>terminé</u>, dont le moment est <b>donné ou sous-entendu</b>.<br>
<b>Present perfect</b> : l'action est reliée au <u>présent</u> (période non terminée, résultat actuel, expérience de vie) et le moment précis n'est <b>pas</b> donné.</div>
<div class="lc-t"><table>
<tr><th>Past simple</th><th>Present perfect</th></tr>
<tr><td>I lost my keys <b>yesterday</b>.</td><td>I've lost my keys. (je ne les ai toujours pas)</td></tr>
<tr><td>She went to Japan <b>in 2019</b>.</td><td>She has been to Japan. (expérience)</td></tr>
<tr><td>We saw him <b>last week</b>.</td><td>We have seen him <b>this week</b>.</td></tr>
</table></div>

<h3>2. Les marqueurs de temps</h3>
<div class="lc-t"><table>
<tr><th>Avec le past simple (période finie)</th><th>Avec le present perfect (jusqu'à maintenant)</th></tr>
<tr><td>yesterday, last week / year, in 2015, two days ago, when I was young, then, at 5 o'clock</td><td>ever, never, already, yet, just, so far, recently, lately, today / this week / this month (non terminés), since, for</td></tr>
</table></div>
<div class="lc-warn">Jamais de present perfect avec un moment précis terminé : ✗ <i>I have seen him yesterday</i> · ✗ <i>She has been to Paris in 2019</i> · ✗ <i>When have you arrived?</i> (When + past simple : <i>When did you arrive?</i>).</div>

<h3>3. Durée : state ou fini ?</h3>
<div class="lc-t"><table>
<tr><th>Situation encore vraie → present perfect</th><th>Situation terminée → past simple</th></tr>
<tr><td>I have lived in Paris for five years. (j'y habite encore)</td><td>I lived in Paris for five years. (je n'y habite plus)</td></tr>
<tr><td>How long have you worked here?</td><td>How long did you work there?</td></tr>
</table></div>

<h3>4. De l'expérience au détail</h3>
<p>On commence souvent par le present perfect (<i>Have you ever been to Japan?</i>), puis on passe au <b>past simple</b> dès qu'on donne des détails : <i>Yes, I have. I went there in 2019 and I loved it.</i></p>
<p>Même schéma pour les nouvelles : <i>The Prime Minister has resigned. He said it was for family reasons.</i></p>

<h3>5. Structures figées</h3>
<div class="lc-box">It's the <b>first / second / third</b> time + present perfect : <i>This is the first time I've eaten sushi.</i><br>
superlatif + <i>ever</i> : <i>It's the best film I've ever seen.</i><br>
<b>Since</b> + moment (past simple) : <i>I've known her since we were children.</i></div>

<h3>6. Résultat présent, période non finie</h3>
<p>Une période de temps qui n'est <b>pas finie</b> (today, this morning, this week, this year) appelle le present perfect : <i>I've drunk three coffees today.</i> Si le moment est précis, on bascule au past simple : <i>I drank three coffees this morning</i> (la matinée est finie).</p>
<p><b>Britannique / américain :</b> l'anglais américain emploie parfois le past simple à la place (<i>Did you eat yet?</i>). Ici on suit la norme britannique.</p>

course: `
<h3>1. Forme</h3>
<div class="lc-box"><b>had + participe passé</b> (identique à toutes les personnes)<br>
I had finished · she had left · they had gone<br>
Négatif : <b>hadn't</b> · Question : <b>Had you…?</b> · Contraction : <b>'d</b> (I'd finished)</div>

<h3>2. L'idée : « le passé du passé »</h3>
<p>Le past perfect place une action <b>avant</b> un autre moment passé. On a donc deux repères dans le passé : l'action la plus ancienne (past perfect) et la plus récente (past simple).</p>
<div class="lc-t"><table>
<tr><th>Ordre des événements</th><th>Exemple</th></tr>
<tr><td>Le film a commencé, puis je suis arrivé</td><td>When I arrived, the film <b>had</b> already <b>started</b>.</td></tr>
<tr><td>Je suis arrivé, puis le film a commencé</td><td>When I arrived, the film started.</td></tr>
<tr><td>Le train est parti avant nous</td><td>By the time we got to the station, the train <b>had left</b>.</td></tr>
</table></div>

<h3>3. Les usages</h3>
<div class="lc-t"><table>
<tr><th>Usage</th><th>Exemple</th></tr>
<tr><td>Action antérieure à un moment passé</td><td>She had never seen snow before that trip.</td></tr>
<tr><td>Cause d'une situation passée</td><td>I felt sick because I had eaten too much cake.</td></tr>
<tr><td>Durée avant un moment passé</td><td>He had lived in Paris for five years before he moved to Rome.</td></tr>
<tr><td>Discours indirect (voir leçon 25)</td><td>She said she had finished.</td></tr>
<tr><td>Troisième conditionnel (leçon 22)</td><td>If I had known, I would have helped.</td></tr>
</table></div>
<p>Marqueurs : <i>already, just, never … before, by the time, when, after, before, until.</i></p>

<h3>4. Le past perfect continuous</h3>
<div class="lc-box"><b>had been + verbe en -ing</b> : activité qui durait <u>avant</u> un moment passé, souvent pour expliquer un état.<br>
She was tired because she <b>had been working</b> all night.<br>
He was out of breath: he <b>had been running</b>.<br>
They <b>had been waiting</b> for an hour when the bus came.</div>
<p>Comme pour le present perfect : <b>simple</b> = résultat, quantité, achèvement ; <b>continuous</b> = activité, durée. Les verbes d'état restent au simple : <i>I had known him for years.</i></p>

<h3>5. Past perfect ou past simple ?</h3>
<p>Quand l'ordre est <b>évident</b> grâce à <i>before, after, as soon as</i>, on peut utiliser le past simple : <i>After she finished, she went home</i> (ou <i>had finished</i>). Le past perfect est <b>indispensable</b> pour éviter l'ambiguïté (<i>When he called, I had already left</i>) et quand il explique une cause.</p>
<div class="lc-warn">Ne l'utilisez pas pour deux actions qui se suivent dans un récit : ✗ <i>I had got up, had breakfast and had left</i> → ✓ <i>I got up, had breakfast and left.</i></div>

✗ <i>I have been waiting for an hour when she arrived</i> → ✓ <i>I had been waiting…</i>
</div>

<h3>1. Ce qui est commun à tous les modaux</h3>
<div class="lc-box"><b>sujet + modal + base verbale</b> : sans -s à la 3<sup>e</sup> personne, sans <i>to</i>, sans <i>do</i>.<br>

<div class="lc-warn">✗ <i>She cans swim</i> · ✗ <i>He must to go</i> · ✗ <i>Do you can help me?</i> · ✗ <i>She can swimming</i><br>
Seuls <i>have to</i> et <i>ought to</i> gardent « to » ; <i>have to</i> fonctionne comme un verbe ordinaire (<i>Do I have to…? She has to…</i>).</div>

<h3>2. Capacité : can, could, be able to</h3>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Emploi</th><th>Exemple</th></tr>
<tr><td>can / can't</td><td>capacité présente</td><td>She can speak three languages.</td></tr>

<tr><td>was / were able to · managed to</td><td>réussite <b>ponctuelle</b> dans le passé</td><td>Yesterday I was able to finish the report in an hour.</td></tr>
<tr><td>will be able to</td><td>futur (will can n'existe pas)</td><td>You'll be able to vote next year.</td></tr>
</table></div>

<h3>3. Permission et demandes</h3>
<p><b>Can I…? Could I…? May I…?</b> (de plus familier à plus formel) : <i>May I use your phone?</i><br>
<b>Can / Could / Would you…?</b> pour demander quelque chose à quelqu'un : <i>Could you pass me the salt?</i><br>
<b>Would you like…?</b> pour proposer : <i>Would you like some tea?</i> · <b>be allowed to</b> = avoir le droit.</p>

<h3>4. Obligation, interdiction, absence d'obligation</h3>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>must</td><td>obligation que l'on s'impose / forte recommandation</td><td>I must call my mum.</td></tr>
<tr><td>have to</td><td>obligation extérieure (règle, loi, contrainte)</td><td>Students have to wear a uniform.</td></tr>
<tr><td><b>mustn't</b></td><td><b>interdiction</b></td><td>You mustn't park here.</td></tr>
<tr><td><b>don't have to</b> · needn't · don't need to</td><td><b>pas obligé</b> (c'est facultatif)</td><td>You don't have to come.</td></tr>
</table></div>
<div class="lc-warn"><b>mustn't ≠ don't have to</b> : <i>You mustn't smoke here</i> (interdit) · <i>You don't have to smoke</i> (rien ne t'y oblige). Passé et futur : <i>had to</i>, <i>will have to</i> (must n'a pas de passé).</div>

<h3>5. Conseil : should, ought to, had better</h3>

<h3>1. Déduction au présent</h3>
<p>On raisonne à partir d'indices pour deviner une situation actuelle.</p>
<div class="lc-t"><table>
<tr><th>Degré de certitude</th><th>Modal</th><th>Exemple</th></tr>
<tr><td>Certain (≈ 95 %)</td><td><b>must be</b></td><td>He's been working all day. He must be tired.</td></tr>
<tr><td>Possible (≈ 50 %)</td><td><b>may / might / could be</b></td><td>She's not answering. She might be asleep.</td></tr>
<tr><td>Impossible (≈ 5 %)</td><td><b>can't be</b></td><td>That can't be true. It makes no sense.</td></tr>
</table></div>
<div class="lc-warn">Pour la déduction négative, on dit <b>can't</b>, pas <i>mustn't</i> : <i>He can't be French. He's from Texas.</i> (« mustn't » = interdiction.)</div>
<p>Pour une action en cours : <b>modal + be + -ing</b> : <i>She must be working. They might be waiting outside.</i></p>

<h3>2. Déduction sur le passé : modal + have + participe</h3>
<div class="lc-box"><b>must have + participe</b> : je suis presque sûr que c'est arrivé<br>
<b>might / may / could have + participe</b> : c'est peut-être arrivé<br>
<b>can't / couldn't have + participe</b> : je suis presque sûr que ce n'est pas arrivé</div>
<div class="lc-t"><table>
<tr><th>Phrase</th><th>Traduction</th></tr>
<tr><td>The ground is wet. It <b>must have rained</b>.</td><td>Il a dû pleuvoir.</td></tr>
<tr><td>He <b>can't have stolen</b> the money. He was abroad.</td><td>Il ne peut pas avoir volé l'argent.</td></tr>
<tr><td>She <b>might have missed</b> the train.</td><td>Elle a peut-être raté le train.</td></tr>
<tr><td>They <b>must have been</b> very tired.</td><td>Ils ont dû être très fatigués.</td></tr>
</table></div>

<h3>3. Reproche et regret : should have, shouldn't have</h3>
<p><b>should have + participe</b> : ce qu'il aurait fallu faire (et qui n'a pas été fait) · <b>shouldn't have + participe</b> : ce qu'il ne fallait pas faire (et qui a été fait).</p>
<div class="lc-box">You <b>should have called</b> me. I was worried.<br>
You <b>shouldn't have said</b> that. It was rude.<br>
I <b>should have listened</b> to your advice.</div>
<p><b>ought to have</b> est un synonyme plus formel de <i>should have</i>.</p>

<h3>4. Possibilité passée non réalisée : could have</h3>
<p><i>We could have taken a taxi, but we walked.</i> · <i>You could have told me!</i> (tu aurais pu me le dire). <b>might have</b> s'emploie aussi pour un reproche : <i>You might have warned me.</i></p>

<h3>5. Needn't have et didn't need to</h3>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Sens</th></tr>
<tr><td><b>needn't have</b> + participe</td><td>on l'a fait, mais c'était inutile : <i>You needn't have waited</i> (tu as attendu pour rien).</td></tr>
<tr><td><b>didn't need to</b> + base</td><td>ce n'était pas nécessaire, (on ne sait pas si on l'a fait) : <i>We didn't need to hurry.</i></td></tr>
</table></div>

<h3>6. Prononciation</h3>
<p>Dans <i>should have, must have, could have</i>, « have » se prononce faiblement /əv/ (« shoulda, coulda ») ; à l'écrit on ne le remplace <b>jamais</b> par « of ».</p>

<h3>1. Structure générale</h3>
<p>Une phrase conditionnelle a deux parties : la <b>proposition en if</b> (la condition) et la <b>proposition principale</b> (le résultat). Si la proposition en <i>if</i> vient en premier, on met une virgule : <i>If it rains, we'll stay home.</i> / <i>We'll stay home if it rains.</i></p>
<div class="lc-warn">Règle absolue : <b>jamais will ni would dans la proposition en if</b> (✗ <i>If I will have time</i> · ✗ <i>If I would know</i>).</div>

<h3>2. Les trois types</h3>
<div class="lc-t"><table>
<tr><th>Type</th><th>if + …</th><th>principale</th><th>Sens</th></tr>
<tr><td><b>Zéro</b></td><td>present simple</td><td>present simple</td><td>vérité générale, loi</td></tr>
<tr><td><b>1<sup>er</sup></b></td><td>present simple</td><td>will + base</td><td>futur réel, possible</td></tr>
<tr><td><b>2<sup>e</sup></b></td><td>past simple</td><td>would + base</td><td>hypothèse irréelle ou peu probable (présent / futur)</td></tr>
</table></div>
<div class="lc-box"><b>Zéro :</b> If you heat ice, it melts. (= When you heat ice…)<br>
<b>1<sup>er</sup> :</b> If it rains tomorrow, we'll stay at home.<br>
<b>2<sup>e</sup> :</b> If I won the lottery, I would travel the world.</div>

<h3>3. Premier conditionnel : variantes</h3>
<p>La principale peut contenir un modal (<i>can, may, might, should</i>) ou un impératif : <i>If you see her, tell her I called. If I have time, I might call you.</i></p>
<div class="lc-t"><table>
<tr><th>Mot</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>unless</td><td>si … ne pas (= if … not)</td><td>Unless you hurry, you'll miss the train.</td></tr>
<tr><td>as long as / provided (that)</td><td>à condition que</td><td>You can borrow my car as long as you drive carefully.</td></tr>
<tr><td>in case</td><td>au cas où (par précaution)</td><td>Take an umbrella in case it rains.</td></tr>
<tr><td>when</td><td>quand (c'est certain)</td><td>I'll call you when I arrive.</td></tr>
</table></div>
<div class="lc-warn"><b>unless</b> contient déjà la négation : ✗ <i>Unless you don't hurry</i> → ✓ <i>Unless you hurry</i>.</div>

<h3>4. Deuxième conditionnel</h3>
<p>Il parle de situations <b>irréelles</b> (contraires à la réalité) ou <b>improbables</b>. Le verbe en <i>if</i> est au past simple, mais le sens est présent ou futur.</p>
<div class="lc-box">If I <b>had</b> more money, I <b>would buy</b> a bigger flat. (je n'en ai pas)<br>
What <b>would</b> you <b>do</b> if you <b>saw</b> a ghost?<br>
She <b>could / might</b> help us if she <b>knew</b>.</div>
<p><b>If I were you…</b> : au 2<sup>e</sup> conditionnel on emploie <b>were</b> pour toutes les personnes (<i>If I were rich, If she were here</i>) ; <i>was</i> existe à l'oral mais <i>were</i> est la forme correcte. <i>If I were you, I'd see a doctor</i> sert à donner un conseil.</p>
<p>Contractions : <i>I'd = I would</i> · <i>wouldn't</i>.</p>

<h3>5. Ne pas confondre 1<sup>er</sup> et 2<sup>e</sup></h3>
<div class="lc-t"><table>
<tr><th>1<sup>er</sup> : réel</th><th>2<sup>e</sup> : irréel</th></tr>
<tr><td>If I <b>win</b> the lottery, I'll buy a house. (possible)</td><td>If I <b>won</b> the lottery, I'd buy a house. (peu probable)</td></tr>

✗ <i>Unless you don't study</i> → ✓ <i>Unless you study</i><br>
✗ <i>If I would be rich</i> → ✓ <i>If I were rich</i>
</div>

<h3>1. Troisième conditionnel : le passé irréel</h3>
<div class="lc-box"><b>If + past perfect, would have + participe passé</b><br>
If I <b>had known</b>, I <b>would have helped</b>. (je ne savais pas, je n'ai pas aidé)<br>
If it <b>hadn't rained</b>, we <b>would have gone out</b>.</div>
<p>Il exprime ce qui <b>aurait pu se passer</b> dans le passé mais ne s'est pas produit : regret, reproche, explication. On peut remplacer <i>would</i> par <i>could</i> ou <i>might</i> : <i>If you had told me, I could have helped.</i></p>
<div class="lc-warn">✗ <i>If I would have known</i> → ✓ <i>If I had known</i> (jamais would dans la proposition en if)<br>

<b>'d</b> peut être <i>had</i> (dans if) ou <i>would</i> (dans la principale) : <i>If I'd known, I'd have come.</i></div>

<h3>2. Conditionnels mixtes</h3>
<p>On combine un passé et un présent selon le sens.</p>
<div class="lc-t"><table>
<tr><th>Type</th><th>Structure</th><th>Exemple</th></tr>
<tr><td>Cause passée → résultat présent</td><td>if + past perfect, would + base</td><td>If I had studied medicine, I would be a doctor now.</td></tr>
<tr><td>Situation présente → résultat passé</td><td>if + past simple, would have + participe</td><td>If I weren't so tired, I would have gone to the party last night.</td></tr>
</table></div>
<p>Expression utile : <b>If it hadn't been for + nom</b> = sans (si ça n'avait pas été pour) : <i>If it hadn't been for your help, I would have failed.</i></p>

<h3>3. Wish : exprimer un regret</h3>
<div class="lc-t"><table>
<tr><th>Situation</th><th>Structure</th><th>Exemple</th></tr>
<tr><td>Regret au <b>présent</b></td><td>wish + past simple</td><td>I wish I had a car. · I wish I were taller. · I wish I could speak Italian.</td></tr>
<tr><td>Regret au <b>passé</b></td><td>wish + past perfect</td><td>I wish I had studied harder. · She wishes she hadn't said that.</td></tr>
<tr><td>Agacement, souhait de changement</td><td>wish + <b>would</b> + base</td><td>I wish you would stop shouting. · I wish it would stop raining.</td></tr>
</table></div>
<div class="lc-warn"><b>Wish + would</b> concerne ce que <u>quelqu'un d'autre</u> ou une chose fait (pas soi-même) : ✗ <i>I wish I would have more time</i> → ✓ <i>I wish I had more time</i>.<br>
✗ <i>I wish I have / will have</i> → ✓ <i>I wish I had</i>.</div>

<h3>4. If only</h3>
<p><b>If only</b> est plus <b>intense</b> que <i>wish</i> et suit les mêmes règles : <i>If only I knew the answer!</i> (présent) · <i>If only I had met you earlier!</i> (passé) · <i>If only it would stop!</i></p>

<h3>5. It's time + past simple</h3>
<p><b>It's time (that) + sujet + past simple</b> = il est temps que : <i>It's time we left. It's late.</i> Le verbe est au passé mais le sens est présent. Variante : <i>It's time to leave.</i></p>

<h3>6. Suppose / what if</h3>
<p><i>Suppose you had the chance, what would you do?</i> (hypothèse présente → past simple) · <i>What if he had refused?</i> (hypothèse passée → past perfect).</p>

course: `
<h3>1. Principe</h3>
<div class="lc-box"><b>sujet + be (au temps voulu) + participe passé</b> (+ by + agent)<br>
Active : <i>Shakespeare wrote Hamlet.</i> → Passive : <i>Hamlet was written by Shakespeare.</i></div>
<p>Le complément d'objet de la phrase active devient le sujet du passif. Le <b>temps</b> du verbe actif se retrouve sur le verbe <b>be</b>.</p>

<h3>2. Formation à tous les temps</h3>
<div class="lc-t"><table>
<tr><th>Temps</th><th>Passif</th></tr>
<tr><td>present simple</td><td>English <b>is spoken</b> here.</td></tr>
<tr><td>present continuous</td><td>The bridge <b>is being repaired</b>.</td></tr>
<tr><td>past simple</td><td>The window <b>was broken</b> yesterday.</td></tr>
<tr><td>past continuous</td><td>The room <b>was being painted</b>.</td></tr>
<tr><td>present perfect</td><td>The letter <b>has been sent</b>.</td></tr>
<tr><td>past perfect</td><td>The house <b>had been sold</b>.</td></tr>
<tr><td>future (will)</td><td>The report <b>will be finished</b> by Friday.</td></tr>
<tr><td>be going to</td><td>A new school <b>is going to be built</b>.</td></tr>
<tr><td>modal</td><td>The car <b>must be repaired</b>. · It <b>should have been done</b>.</td></tr>
<tr><td>infinitif</td><td>She wants <b>to be promoted</b>.</td></tr>
<tr><td>gérondif</td><td>I hate <b>being told</b> what to do.</td></tr>
</table></div>

<h3>3. Quand utiliser le passif ?</h3>
<div class="lc-t"><table>
<tr><th>Situation</th><th>Exemple</th></tr>
<tr><td>L'auteur de l'action est inconnu ou sans importance</td><td>My bike was stolen.</td></tr>
<tr><td>L'auteur est évident</td><td>The thief was arrested. (par la police)</td></tr>
<tr><td>On veut mettre l'accent sur le sujet / le résultat</td><td>The bridge was built in 1890.</td></tr>
<tr><td>Style formel, scientifique, administratif</td><td>The samples were analysed.</td></tr>
<tr><td>Équivalent du « on » français</td><td>English is spoken here. (On parle anglais ici.)</td></tr>
</table></div>
<p>On ajoute <b>by + agent</b> seulement si l'information est utile : <i>Hamlet was written by Shakespeare.</i></p>

<h3>4. Négatif et questions</h3>
<p>Négatif : <i>The cake wasn't eaten. It hasn't been delivered.</i> · Questions : <i>Was the window broken by Tom? Where was it made? Who was the book written by?</i> Jamais de <i>do / did</i> : on inverse <i>be</i> avec le sujet.</p>

<h3>5. Verbes à deux compléments</h3>
<p><i>They gave me a book</i> → deux passifs possibles : <b>I was given a book</b> (le plus courant) ou <i>A book was given to me.</i> Même chose avec <i>send, show, tell, offer, ask, teach.</i></p>

<h3>6. Qui ne se met pas au passif</h3>
<div class="lc-warn">Les verbes <b>intransitifs</b> (sans complément d'objet) n'ont pas de passif : <i>happen, arrive, die, come, go, sleep, seem</i>.<br>
✗ <i>Nothing was happened</i> → ✓ <i>Nothing happened</i> · ✗ <i>He was arrived</i> → ✓ <i>He arrived</i><br>
Les verbes d'état comme <i>have, resemble, fit</i> n'ont pas non plus de passif.</div>

<h3>7. Phrasal verbs et get-passive</h3>
<p>Le passif des verbes à particule garde la particule : <i>The meeting was called off. The children were looked after.</i> Le <b>get-passive</b>, plus familier, insiste sur un événement : <i>He got arrested. She got promoted.</i></p>

<h3>1. Le passif impersonnel avec say, think, believe…</h3>

<tr><th>Structure</th><th>Exemple</th></tr>

<div class="lc-box"><b>Quel infinitif ?</b><br>
<b>to be / to work / to live</b> (infinitif présent) : situation actuelle → He is believed <b>to live</b> in Spain.<br>
<b>to be + -ing</b> : action en cours → She is thought <b>to be working</b> abroad.<br>
<b>to have + participe</b> (infinitif passé) : fait antérieur → The thief is thought <b>to have escaped</b>.</div>

<p><b>get + participe passé</b> est plus familier que <i>be</i> et insiste sur un <b>événement</b>, souvent inattendu : <i>He got arrested for speeding. She got promoted. The window got broken.</i></p>

<h3>3. Le causatif : have something done</h3>
<div class="lc-box"><b>have + objet + participe passé</b> = faire faire quelque chose (par quelqu'un d'autre)<br>

<div class="lc-t"><table>
<tr><th>Je l'ai fait moi-même</th><th>Je l'ai fait faire</th></tr>
<tr><td>I repaired my bike.</td><td>I had my bike repaired.</td></tr>
<tr><td>I cut my hair.</td><td>I had my hair cut.</td></tr>

<p><b>get something done</b> est la version familière : <i>I got my passport renewed.</i></p>
<p>Questions et négations utilisent <i>do / did</i> avec <i>have</i> : <i>Did you have your hair cut? Where do you have your car serviced? I haven't had my eyes tested for two years.</i></p>

<h3>4. Mauvaise expérience : have something done</h3>
<p>La même structure exprime aussi ce qui <b>nous arrive</b> sans qu'on l'ait voulu : <i>She had her bag stolen at the station. He had his phone stolen.</i></p>

<p>Le discours indirect rapporte les paroles de quelqu'un sans les citer mot pour mot. On change le verbe introducteur, les <b>pronoms</b>, les <b>temps</b> (souvent) et les <b>indicateurs de temps et de lieu</b>.</p>

<h3>1. Les pronoms relatifs</h3>
<div class="lc-t"><table>
<tr><th>Pronom</th><th>Remplace</th><th>Exemple</th></tr>

<h3>2. Relative déterminative (defining)</h3>
<p>Elle est <b>indispensable</b> pour identifier le nom : sans elle, la phrase perd son sens. <b>Pas de virgules.</b> On peut utiliser <i>that</i> à la place de <i>who / which</i>.</p>
<div class="lc-box">The girl <b>who / that</b> lives upstairs is French.<br>
The car <b>which / that</b> I bought is red.</div>

<h3>3. Relative explicative (non-defining)</h3>
<p>Elle ajoute une information <b>supplémentaire</b>, non nécessaire à l'identification. Elle est <b>entre virgules</b>. <i>That</i> est <b>interdit</b>, et le pronom ne peut <b>jamais être omis</b>.</p>
<div class="lc-box">My brother<b>, who lives in Paris,</b> is a chef.<br>
The car<b>, which is red,</b> is mine.<br>
Paris<b>, where I was born,</b> is beautiful.</div>
<p><b>which</b> peut aussi renvoyer à <b>toute la proposition précédente</b> : <i>He passed the exam, <b>which</b> surprised everyone.</i></p>

<h3>4. Omission du pronom relatif</h3>
<div class="lc-box">On peut omettre le pronom quand il est <b>complément d'objet</b> (dans une relative déterminative).<br>
The man (who) I met was kind. · The film (that) we saw was boring.<br>
<b>Jamais</b> quand il est sujet : The man <u>who lives here</u> is kind.</div>

<h3>5. Prépositions</h3>
<p>Style courant : la préposition reste en fin de proposition : <i>The woman (who) I work with is French. This is the pen (that) I was looking for.</i> Style formel : <i>The man <b>to whom</b> I spoke was polite.</i> (préposition + <i>whom / which</i>, pas de <i>that</i>).</p>

title: 'Gérondif et infinitif',

course: `
<h3>1. Le principe</h3>
<p>Quand un verbe en suit un autre, on doit choisir entre <b>-ing</b> (gérondif), <b>to + infinitif</b> ou <b>base verbale</b> (sans to). Le choix dépend du <b>premier verbe</b> : il faut l'apprendre par groupes.</p>

<h3>2. Verbes + -ing</h3>
<div class="lc-box">enjoy · mind · avoid · finish · suggest · keep · practise · consider · deny · admit · risk · imagine · miss · give up · can't help · it's no use · it's worth<br>
I enjoy <b>swimming</b>. · She finished <b>working</b> at six. · He suggested <b>going</b> to the cinema.</div>
<p>Aussi après toute <b>préposition</b> : <i>interested in learning, good at helping, instead of waiting, before leaving.</i> Y compris <b>to</b> prépositionnel : <i>I'm looking forward <b>to seeing</b> you · be used to doing · object to doing.</i></p>
<p>Le gérondif peut être <b>sujet</b> : <i>Swimming is good for you.</i> Expressions : <i>It's no use worrying · There's no point in waiting · It's worth trying.</i></p>

<h3>3. Verbes + to + infinitif</h3>
<div class="lc-box">want · need · decide · hope · plan · promise · refuse · agree · manage · afford · learn · seem · expect · offer · choose · would like<br>
He decided <b>to take</b> the job. · I can't afford <b>to buy</b> a new car.</div>

<h3>4. Verbe + objet + to + infinitif</h3>
<p><i>tell, ask, want, allow, advise, invite, expect, persuade, force, would like</i> : <i>They allowed us <b>to enter</b>. She told me <b>to wait</b>. I want you <b>to come</b>.</i></p>
<div class="lc-warn">✗ <i>I want that you come</i> → ✓ <i>I want you to come</i></div>

<h3>5. Verbes + base verbale (sans to)</h3>
<div class="lc-t"><table>
<tr><th>Cas</th><th>Exemple</th></tr>
<tr><td>Modaux</td><td>She can swim. You must go.</td></tr>
<tr><td>make / let + objet</td><td>He made me clean the room. She let him leave early.</td></tr>
<tr><td>had better / would rather</td><td>You'd better see a doctor. I'd rather stay at home.</td></tr>
<tr><td>see / hear / watch + objet</td><td>I saw him leave. (action complète) · I saw him leaving. (en cours)</td></tr>
</table></div>

<h3>6. Même sens avec les deux formes</h3>
<p><b>like, love, hate, prefer, start, begin, continue</b> acceptent -ing ou to : <i>I like swimming / to swim.</i> (Avec <i>would like / would love</i>, on emploie <b>to</b> : <i>I'd like to go.</i>)</p>

<h3>7. Le sens change selon la forme</h3>
<div class="lc-t"><table>
<tr><th>Verbe</th><th>+ -ing</th><th>+ to + infinitif</th></tr>
<tr><td>remember</td><td>se souvenir d'avoir fait : I remember <b>meeting</b> him last year.</td><td>ne pas oublier de faire : Remember <b>to lock</b> the door.</td></tr>
<tr><td>forget</td><td>oublier d'avoir fait : I'll never forget <b>seeing</b> it.</td><td>oublier de faire : Don't forget <b>to call</b>.</td></tr>
<tr><td>stop</td><td>arrêter de : He stopped <b>smoking</b>.</td><td>s'arrêter pour : She stopped <b>to buy</b> a coffee.</td></tr>
<tr><td>try</td><td>essayer pour voir : Try <b>drinking</b> some water.</td><td>faire un effort : I tried <b>to open</b> the window.</td></tr>
<tr><td>regret</td><td>regretter d'avoir fait : I regret <b>saying</b> that.</td><td>regretter d'annoncer : I regret <b>to inform</b> you…</td></tr>
</table></div>

<h3>8. But, adjectifs, too / enough</h3>
<p><b>to + infinitif</b> exprime le but : <i>I'm saving money <b>to buy</b> a laptop.</i> (pas <i>for buy</i>). Après un adjectif : <i>happy to help, difficult to say.</i> Avec <i>too / enough</i> : <i>too tired to drive, old enough to travel alone.</i></p>

<h3>9. Pièges</h3>
<div class="lc-warn">
✗ <i>I enjoy to play</i> → ✓ <i>I enjoy playing</i><br>
✗ <i>She decided going</i> → ✓ <i>She decided to go</i><br>
✗ <i>I look forward to see you</i> → ✓ <i>I look forward to seeing you</i><br>
✗ <i>She suggested to go</i> → ✓ <i>She suggested going</i><br>
✗ <i>He made me to wait</i> → ✓ <i>He made me wait</i>
</div>

course: `
<h3>1. Qu'est-ce qu'un phrasal verb ?</h3>
<p>Un phrasal verb associe un <b>verbe + une particule</b> (up, off, out, on, in, down, away…) et prend souvent un sens <b>idiomatique</b>, différent de celui du verbe seul : <i>give up</i> (abandonner), <i>look after</i> (s'occuper de), <i>take off</i> (décoller).</p>

<h3>2. Les quatre types</h3>
<div class="lc-t"><table>
<tr><th>Type</th><th>Règle</th><th>Exemples</th></tr>
<tr><td><b>Intransitif</b></td><td>pas de complément d'objet</td><td>The plane took off. · Don't give up. · He grew up in Lyon.</td></tr>
<tr><td><b>Transitif séparable</b></td><td>l'objet peut se placer <u>après la particule</u> ou <u>entre</u>. Avec un <b>pronom</b>, il va <b>obligatoirement entre</b></td><td>Turn off the light / Turn the light off / <b>Turn it off.</b></td></tr>
<tr><td><b>Transitif inséparable</b></td><td>l'objet vient toujours après la particule</td><td>Look after the children / Look after <b>them</b>.</td></tr>
<tr><td><b>À trois mots</b></td><td>verbe + particule + préposition, inséparable</td><td>put up with · run out of · come up with · look forward to · get on with</td></tr>
</table></div>
<div class="lc-warn">✗ <i>Turn off it</i> → ✓ <i>Turn it off</i> · ✗ <i>Pick up it</i> → ✓ <i>Pick it up</i></div>

<h3>3. Phrasal verbs courants</h3>
<div class="lc-t"><table>
<tr><th>Phrasal verb</th><th>Sens</th><th>Phrasal verb</th><th>Sens</th></tr>
<tr><td>give up</td><td>abandonner</td><td>look for</td><td>chercher</td></tr>
<tr><td>look after</td><td>s'occuper de</td><td>look up</td><td>chercher (dans un livre, en ligne)</td></tr>
<tr><td>find out</td><td>découvrir</td><td>set up</td><td>créer, installer</td></tr>

</table></div>

<h3>4. Verbes + préposition (sans changement de sens)</h3>
<div class="lc-t"><table>
<tr><th>Préposition</th><th>Verbes</th></tr>
<tr><td><b>for</b></td><td>wait for · look for · ask for · pay for · apologise for · hope for</td></tr>
<tr><td><b>on</b></td><td>depend on · rely on · insist on · concentrate on</td></tr>

<h3>1. Deux structures à ne pas confondre</h3>
<div class="lc-t"><table>
<tr><th>Structure</th><th>Sens</th><th>Suivi de</th><th>Exemple</th></tr>
<tr><td><b>used to</b></td><td>habitude ou état passé qui n'existe plus</td><td><b>base verbale</b></td><td>I used to smoke. (je ne fume plus)</td></tr>

<tr><td><b>get used to</b></td><td>s'habituer à</td><td><b>-ing</b> ou nom</td><td>I'm getting used to the noise.</td></tr>
</table></div>

<h3>2. Used to + base : le passé révolu</h3>
<div class="lc-box">She <b>used to live</b> in Paris, but now she lives in Rome.<br>
We <b>used to go</b> camping every summer.<br>
There <b>used to be</b> a cinema here.</div>
<p>Il s'emploie pour des <b>habitudes</b> et des <b>états</b> du passé qui ont changé : <i>He used to be shy, but he's confident now.</i> Il n'a pas de présent : pour une habitude actuelle on utilise le present simple + <i>usually</i>.</p>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Exemple</th></tr>
<tr><td>Négatif</td><td>I <b>didn't use to</b> like olives. (parfois : used not to)</td></tr>
<tr><td>Question</td><td><b>Did</b> you <b>use to</b> play the piano?</td></tr>
</table></div>
<div class="lc-warn">Avec <i>did / didn't</i>, on écrit <b>use to</b> (sans d) : ✗ <i>Did you used to…?</i> → ✓ <i>Did you use to…?</i> ; ✗ <i>I didn't used to</i> → ✓ <i>I didn't use to</i>.</div>

<h3>3. Would pour les habitudes passées</h3>
<p><b>would</b> remplace <i>used to</i> pour des <b>actions répétées</b> (jamais pour des états) : <i>When I was a child, we would go to the lake every summer.</i></p>
<div class="lc-warn">✗ <i>I would live in Paris when I was young</i> (état) → ✓ <i>I used to live in Paris</i><br>
Avec une <b>durée précise</b>, on utilise le past simple : <i>We lived in Rome for five years</i> (pas <i>used to … for five years</i>).</div>

<h3>4. Be used to / get used to + -ing</h3>
<p>Ici <b>to</b> est une <b>préposition</b> : il est suivi d'un nom ou du gérondif (-ing), jamais de la base verbale.</p>
<div class="lc-box">I'm used to <b>driving</b> on the left. · She isn't used to <b>living</b> alone.<br>
It took me a while to get used to <b>the noise</b>. · I can't get used to <b>driving</b> on the left.</div>
<div class="lc-t"><table>
<tr><th>Forme</th><th>Exemple</th></tr>
<tr><td>be used to (état)</td><td>He is used to working at night. (il en a l'habitude)</td></tr>
<tr><td>get used to (processus)</td><td>He is getting used to working at night. (il s'y habitue)</td></tr>
<tr><td>Passé</td><td>I got used to the climate after a few months.</td></tr>
</table></div>

<div class="lc-box"><b>I used to play football</b> = je jouais au football (avant).<br>

<b>I'm getting used to playing football</b> = je m'habitue à jouer au football.</div>

course: `
<h3>1. Pourquoi les connecteurs ?</h3>
<p>Les connecteurs relient les idées et rendent un texte logique. Chacun a un <b>sens</b> et une <b>construction</b> (suivi d'une proposition, d'un nom, d'un -ing) ; il faut connaître les deux.</p>

<h3>2. Ajout</h3>
<div class="lc-box"><b>and · also · as well as · besides · moreover · furthermore · in addition (to) · what's more</b><br>
The job is well paid. <b>Moreover</b>, the hours are flexible.</div>

<h3>3. Opposition et concession</h3>
<div class="lc-t"><table>
<tr><th>Connecteur</th><th>Construction</th><th>Exemple</th></tr>
<tr><td><b>but · yet</b></td><td>entre deux propositions</td><td>It was cold, but we went out.</td></tr>
<tr><td><b>although · though · even though</b></td><td>+ <b>proposition</b></td><td>Although it was raining, we went for a walk.</td></tr>
<tr><td><b>despite · in spite of</b></td><td>+ <b>nom ou -ing</b></td><td>Despite the rain, we went for a walk. In spite of being tired, she went out.</td></tr>
<tr><td><b>however · nevertheless</b></td><td>début de phrase, + virgule</td><td>I was tired. However, I kept working.</td></tr>
<tr><td><b>whereas · while</b></td><td>contraste entre deux faits</td><td>I like tea, whereas my sister prefers coffee.</td></tr>
<tr><td><b>on the other hand · in contrast</b></td><td>début de phrase</td><td>The flat is small. On the other hand, it's cheap.</td></tr>
</table></div>
<div class="lc-warn">✗ <i>Although it was late, but we stayed</i> (jamais although … but) · ✗ <i>Despite of</i> → ✓ <i>Despite</i> / <i>In spite of</i> · ✗ <i>Despite it rained</i> → ✓ <i>Despite the rain / Although it rained</i></div>

<h3>4. Cause et conséquence</h3>
<div class="lc-t"><table>
<tr><th>Cause</th><th>Conséquence</th></tr>
<tr><td><b>because</b> + proposition · <b>because of / due to / owing to / thanks to</b> + nom · as · since</td><td><b>so</b> · <b>therefore</b> · <b>consequently</b> · <b>as a result</b> · that's why</td></tr>
<tr><td>She stayed home <b>because</b> she was ill. / <b>because of</b> her illness.</td><td>He forgot his keys. <b>As a result</b>, he couldn't get in.</td></tr>
</table></div>

<h3>5. But, condition</h3>
<p><b>to / in order to / so as to</b> + infinitif : <i>I'm learning English in order to get a better job.</i> · <b>so that</b> + proposition : <i>I left early so that I wouldn't miss the train.</i> · <b>unless, as long as, provided that</b> (voir leçon 21).</p>

<h3>6. Ordre et temps</h3>
<div class="lc-box"><b>first(ly) · then · next · after that · finally · lastly · meanwhile · at the same time · eventually · in the end · as soon as</b><br>
First, mix the eggs. <b>Then</b>, add the flour. <b>Finally</b>, bake for 30 minutes.</div>

<h3>7. Exemples, reformulation, conclusion, opinion</h3>
<div class="lc-t"><table>
<tr><th>Fonction</th><th>Connecteurs</th></tr>
<tr><td>Exemplifier</td><td>for example · for instance · such as</td></tr>
<tr><td>Reformuler</td><td>in other words · that is to say</td></tr>
<tr><td>Conclure</td><td>in conclusion · to sum up · overall</td></tr>
<tr><td>Donner son avis</td><td>in my opinion · personally · as far as I'm concerned</td></tr>
</table></div>

<h3>8. Ponctuation</h3>
<p>Les adverbes de liaison (<i>however, therefore, moreover</i>) s'écrivent avec une <b>virgule</b> après eux. Après un point-virgule : <i>He worked a lot; therefore, he was tired.</i> Deux propositions complètes séparées par une simple virgule (<i>comma splice</i>) sont incorrectes.</p>

<h3>9. Pièges</h3>
<div class="lc-warn">
✗ <i>Because the traffic, I was late</i> → ✓ <i>Because of the traffic…</i><br>
✗ <i>In spite that</i> → ✓ <i>In spite of the fact that</i> / <i>although</i><br>
✗ <i>So that I don't to miss</i> → ✓ <i>So that I don't miss</i>
</div>

<h3>1. Comparaison progressive : the … the …</h3>
<div class="lc-box"><b>the + comparatif, the + comparatif</b> = plus … plus …<br>

<h3>2. Comparatifs doubles : évolution</h3>
<p><b>comparatif + and + comparatif</b> : <i>It's getting colder and colder. · more and more difficult · better and better.</i> (Avec les adjectifs longs : <i>more and more</i> + adjectif.)</p>

<h3>1. L'ordre des déterminants</h3>
<p>Certains mots (<i>all, both, half, double, twice, such, what, quite</i>) se placent <b>avant</b> l'article ou le possessif :</p>
<div class="lc-box"><b>all the students · both my parents · half the time · twice the price · such a lovely day · what a surprise · quite a few</b></div>
<p>Avec un pronom, on utilise <b>of</b> : <i>all of them, both of us, half of it.</i> Les pronoms <i>all / both</i> se placent aussi <b>après le sujet</b>, avant le verbe : <i>We all like pizza. They both left early.</i></p>

<h3>2. All, whole, every, each</h3>
<div class="lc-t"><table>
<tr><th>Mot</th><th>Emploi</th><th>Exemple</th></tr>
<tr><td><b>all</b> + nom (sans article = général / durée)</td><td>all day long · all the students</td><td>I've been working all day long.</td></tr>
<tr><td><b>the whole</b> + nom singulier</td><td>= « en entier »</td><td>I spent the whole day at the beach.</td></tr>
<tr><td><b>every</b> + singulier</td><td>tous, sans exception (groupe)</td><td>Every student has a locker.</td></tr>
<tr><td><b>each</b> (of) + singulier</td><td>chacun, individuellement</td><td>Each of the girls has a bag.</td></tr>
</table></div>

<h3>3. Both, either, neither</h3>
<p><b>both</b> = les deux (pluriel) · <b>either</b> = l'un ou l'autre · <b>neither</b> = ni l'un ni l'autre. Après <i>of</i>, <b>neither of</b> prend en principe un verbe singulier : <i>Neither of my brothers lives here.</i></p>

<h3>4. Another, other, others, the other(s)</h3>
<div class="lc-t"><table>
<tr><th>Mot</th><th>Sens</th><th>Exemple</th></tr>
<tr><td>another + singulier</td><td>un autre (supplémentaire ou différent)</td><td>I don't like this shirt. Show me another one.</td></tr>
<tr><td>other + pluriel</td><td>d'autres</td><td>Do you have other colours?</td></tr>
<tr><td>the other</td><td>l'autre (le dernier qui reste)</td><td>One lives in Paris and the other lives in Rome.</td></tr>
<tr><td>the others</td><td>les autres (tous les restants)</td><td>I ate one cake. Where are the others?</td></tr>
<tr><td>others</td><td>d'autres (un groupe indéterminé)</td><td>Some like tea; others prefer coffee.</td></tr>
</table></div>

<h3>5. Les quantités avec of</h3>
<div class="lc-t"><table>
<tr><th>Avec un nom pluriel</th><th>Avec un nom indénombrable</th></tr>
<tr><td>a large number of · several · a couple of · a handful of · dozens of · hundreds of</td><td>a great deal of · a large amount of · a bit of · plenty of</td></tr>
<tr><td>most of the · some of the · none of the</td><td>most of the · some of the · none of the</td></tr>
</table></div>
<div class="lc-box"><b>a number of</b> + pluriel → verbe au <b>pluriel</b> (A number of problems have occurred.)<br>
<b>the number of</b> → verbe au <b>singulier</b> (The number of accidents has fallen.)<br>
<b>quite a few</b> = pas mal de (positif) · <b>not a few</b> = beaucoup</div>
<p>Avec <b>hundred, thousand, dozen</b> : précédés d'un chiffre, ils restent invariables (<i>three hundred</i>) ; au sens vague, ils prennent <b>-s</b> et <b>of</b> : <i>hundreds of people, dozens of emails.</i></p>

<h3>6. Some et any : nuances</h3>
<p><b>some</b> + nom singulier = un certain (inconnu) : <i>Some man called.</i> · <b>any</b> en phrase affirmative = n'importe quel : <i>Any day is fine.</i></p>

✗ <i>all the day</i> → ✓ <i>all day</i> / <i>the whole day</i> · ✗ <i>Every students</i> → ✓ <i>Every student</i><br>

✗ <i>a half hour</i> en anglais britannique : <i>half an hour</i>
</div>

<h3>1. La règle de base</h3>
<p>Le verbe s'accorde avec le <b>noyau du sujet</b>, pas avec le mot le plus proche. Les compléments intercalés sont ignorés.</p>
<div class="lc-box">The <b>box</b> of chocolates <b>is</b> on the table. · The <b>students</b> in the class <b>are</b> happy.<br>
My <b>teacher</b>, together with her students, <b>is</b> coming. (<i>together with, as well as, along with</i> ne changent pas l'accord)</div>

<h3>2. Sujets coordonnés</h3>
<div class="lc-t"><table>
<tr><th>Structure</th><th>Accord</th><th>Exemple</th></tr>
<tr><td>A <b>and</b> B (deux éléments)</td><td>pluriel</td><td>My friend and my colleague are coming.</td></tr>
<tr><td>A and B (une seule idée / personne)</td><td>singulier</td><td>Bread and butter is my favourite breakfast. · My friend and colleague is coming.</td></tr>
<tr><td>every / each + A and B</td><td>singulier</td><td>Every man and woman is welcome.</td></tr>
<tr><td>A <b>or / nor</b> B · either … or · neither … nor · not only … but also</td><td>le sujet le <b>plus proche</b></td><td>Neither the teacher nor the students are ready. · Either my brothers or my sister is coming.</td></tr>
</table></div>

<h3>3. Pronoms indéfinis</h3>
<div class="lc-t"><table>
<tr><th>Singulier</th><th>Pluriel</th><th>Selon le nom</th></tr>
<tr><td>each, every, everyone, everybody, someone, no one, anybody, either, neither</td><td>both, few, many, several</td><td>all, some, most, none, any + of + nom</td></tr>
<tr><td>Everyone is here. Each of the girls has a bag.</td><td>Both of them are here. Many of the students were late.</td><td>Most of the water is dirty. Most of the cars are red.</td></tr>
</table></div>

<h3>4. Noms collectifs</h3>
<p><i>team, family, class, committee, government, staff, audience</i> : en <b>anglais britannique</b>, le verbe peut être au singulier (le groupe comme un tout) ou au pluriel (les individus) ; l'anglais américain préfère le singulier. Mais certains noms sont <b>toujours pluriels</b> : <b>the police, people, cattle, the clergy</b> : <i>The police are looking for him.</i></p>

<h3>5. Expressions de quantité</h3>
<div class="lc-box"><b>a number of</b> + pluriel → <b>pluriel</b> · <b>the number of</b> → <b>singulier</b><br>
<b>one of</b> + pluriel → <b>singulier</b> : One of my friends lives in Canada.<br>
<b>a lot of / plenty of / most of / half of</b> + nom → verbe selon le <b>nom</b></div>

<h3>6. Cas particuliers</h3>
<div class="lc-t"><table>

<tr><td>Noms de pays ou titres au pluriel (un seul objet)</td><td>The Netherlands is flat. The United States is large.</td></tr>

<tr><td>the + adjectif (groupe)</td><td>The rich are not always happy.</td></tr>
</table></div>

<h3>7. There is / there are</h3>
<p>Le verbe s'accorde avec le <b>nom qui suit</b> : <i>There are two cars outside. There were a lot of people at the party.</i> (À l'oral, <i>there's</i> s'emploie souvent devant un pluriel, mais c'est à éviter à l'écrit.)</p>

<h3>1. L'inversion après un adverbe négatif ou restrictif</h3>
<p>Quand un adverbe négatif ou restrictif est placé <b>en tête de phrase</b> pour insister, le sujet et l'auxiliaire s'inversent, comme dans une question.</p>
<div class="lc-box"><b>adverbe + auxiliaire + sujet + verbe principal</b><br>
Never <b>have I seen</b> such a beautiful place. · Rarely <b>does he go</b> to the cinema.</div>
<div class="lc-t"><table>
<tr><th>Adverbes</th><th>Exemples</th></tr>
<tr><td>never · rarely · seldom · nowhere · at no time</td><td>Seldom do we eat out. · Nowhere have I seen such kindness.</td></tr>
<tr><td>hardly / scarcely / barely … <b>when</b></td><td>Hardly had I arrived when it started to rain.</td></tr>
<tr><td>no sooner … <b>than</b></td><td>No sooner had she left than the phone rang.</td></tr>
<tr><td>not only … but (also)</td><td>Not only did he lie, but he also stole.</td></tr>
<tr><td>not until · only after / when / if / then / by</td><td>Not until midnight did he get home. · Only then did I understand.</td></tr>
<tr><td>under no circumstances · on no account · in no way</td><td>Under no circumstances should you open this door.</td></tr>
<tr><td>little (= ne … pas du tout)</td><td>Little did he know what was coming.</td></tr>
</table></div>
<div class="lc-warn">Avec un verbe au present ou past simple, on insère <b>do / does / did</b> : <i>Rarely does he go…</i> ✗ <i>Rarely he goes</i> · ✗ <i>Rarely goes he</i>. Après <i>no sooner</i> on utilise <b>than</b>, après <i>hardly / scarcely</i> on utilise <b>when</b>.</div>

<h3>2. Inversion avec so et such</h3>
<p><b>So + adjectif + verbe + sujet</b> : <i>So tired was he that he fell asleep at once.</i> · <b>Such + be + sujet</b> : <i>Such was the noise that nobody could sleep.</i></p>

<h3>3. Inversion conditionnelle (style formel)</h3>
<div class="lc-t"><table>
<tr><th>Avec if</th><th>Avec inversion</th></tr>
<tr><td>If I had known, I would have helped.</td><td><b>Had I known</b>, I would have helped.</td></tr>
<tr><td>If I were you, I would accept.</td><td><b>Were I you</b>, I would accept.</td></tr>
<tr><td>If you should need help, call me.</td><td><b>Should you need</b> help, call me.</td></tr>
</table></div>

<h3>4. Inversion après un adverbe de lieu</h3>
<p>Verbe avant le sujet (surtout <i>be, stand, come, lie, sit</i>) : <i>In the corner stood an old piano. · Here comes the bus. · Down came the rain.</i> Mais avec un <b>pronom</b> sujet, pas d'inversion : <i>Here he comes.</i></p>

<h3>5. So, neither, nor</h3>
<p><i>I love jazz. — <b>So do I.</b> · I haven't seen it. — <b>Neither / Nor have I.</b></i> L'auxiliaire reprend celui du premier énoncé.</p>

<h3>6. Phrases clivées (cleft sentences)</h3>
<p>Elles servent à mettre un élément en relief.</p>
<div class="lc-t"><table>

<tr><td><b>do / does / did</b> emphatique</td><td>I did like the film, but the ending was weak.</td></tr>
</table></div>

<h3>1. Le subjonctif mandatif</h3>
<p>Après les verbes et adjectifs qui expriment une <b>demande, un ordre, une nécessité</b>, on emploie la <b>forme de base du verbe</b> (sans -s, sans temps) : c'est le subjonctif.</p>
<div class="lc-box"><b>verbe / adjectif + that + sujet + base verbale</b><br>
I suggest that he <b>see</b> a doctor. · The manager insisted that every employee <b>sign</b> the form.<br>
It is essential that she <b>be</b> on time. · They demanded that the prisoner <b>be</b> released.</div>
<div class="lc-t"><table>
<tr><th>Verbes</th><th>Adjectifs</th></tr>
<tr><td>suggest · recommend · insist · demand · require · propose · request · ask · urge · order</td><td>essential · vital · important · necessary · imperative · crucial</td></tr>
</table></div>
<p><b>Négatif</b> : <i>not</i> + base (<i>I recommend that he not drive tonight</i>). <b>Passif</b> : <i>that the report <b>be</b> completed</i>.</p>
<div class="lc-warn"><b>Britannique / américain.</b> L'anglais britannique utilise souvent <i>should</i> : <i>I suggest that he <b>should</b> see a doctor</i>. L'américain préfère le subjonctif sans <i>should</i>. Ce qui est <b>incorrect</b> : ✗ <i>I suggest that he sees</i> · ✗ <i>he will see</i> · ✗ <i>he to see</i>.</div>

<h3>2. Le subjonctif en were</h3>
<p>Pour les situations irréelles, <b>were</b> remplace <i>was</i> à toutes les personnes : <i>If I were rich… · I wish he were here. · He spends money as if he were a millionaire. · Were it not for the rain, we would go out.</i></p>

<h3>3. Expressions figées</h3>

<h3>1. Les trois types de participes</h3>
<div class="lc-t"><table>
<tr><th>Type</th><th>Forme</th><th>Sens</th><th>Exemple</th></tr>
<tr><td><b>présent</b></td><td>verbe + -ing</td><td>actif, simultané ou cause</td><td>Walking down the street, I saw an old friend. · Feeling tired, she went to bed.</td></tr>
<tr><td><b>passé</b></td><td>participe passé</td><td>passif</td><td>Written in 1990, the book is still popular. · Exhausted by the trip, he fell asleep.</td></tr>
<tr><td><b>parfait</b></td><td>having + participe passé</td><td>action <u>antérieure</u></td><td>Having finished the work, he went home.</td></tr>

<p>Négatif : <b>not</b> devant le participe : <i>Not knowing what to do, she asked for help. · Not having been invited, he stayed home.</i></p>

<h3>2. Même sujet obligatoire</h3>
<div class="lc-warn">Le sujet de la proposition participiale doit être <b>le même</b> que celui de la proposition principale. Sinon, c'est un <b>participe suspendu</b> (<i>dangling participle</i>) :<br>
✗ <i>Walking down the street, a car hit me.</i> (c'est la voiture qui marche ?)<br>
✓ <i>Walking down the street, I was hit by a car.</i></div>

<h3>3. Après une conjonction ou une préposition</h3>
<p><b>-ing</b> après <i>before, after, while, on, by, without, instead of</i> : <i>Before leaving, please sign here. · On arriving, he called me. · She left without saying goodbye.</i></p>
<p>Avec un adjectif ou un participe passé après <i>although, when, if, once, while</i> : <i>Although tired, he kept working. · When asked, he refused to answer. · If possible, call me back.</i></p>

<h3>4. Les participes pour exprimer la cause, le temps</h3>
<div class="lc-box"><b>Being a teacher, she understands children.</b> (= Because she is a teacher)<br>
<b>Born in 1990, she grew up in Lyon.</b> (= She was born in 1990 and…)<br>

<h3>5. La construction absolue</h3>
<p>Quand le sujet change, on le <b>nomme</b> devant le participe : <i>The weather being fine, we went out. · The meeting finished, everyone went home.</i> Plus courant avec <b>with</b> : <i>With the sun shining, we sat outside. · She stood there with her arms folded.</i></p>

<h3>6. Relatives réduites</h3>
<p>Le participe remplace <i>who / which + be</i> : <i>The man <b>standing</b> over there is my uncle. · The documents <b>sent</b> yesterday arrived today. · The people <b>waiting</b> outside are cold.</i></p>

<h3>7. Verbes de perception + participe</h3>
<p><i>I saw him <b>running</b> across the road</i> (en train de courir) · <i>I saw him <b>run</b> across the road</i> (action complète). <i>Follow the instructions: Following the instructions, he assembled the shelf.</i></p>

✗ <i>Not been invited</i> → ✓ <i>Not having been invited</i><br>
✗ <i>The weather been fine</i> → ✓ <i>The weather being fine</i>
</div>

course: `
<h3>1. Pourquoi éviter la répétition ?</h3>
<p>L'anglais évite de répéter ce qui est évident. On <b>omet</b> des mots (ellipse) ou on les <b>remplace</b> par un mot léger (substitution).</p>

<h3>2. L'ellipse</h3>
<div class="lc-t"><table>
<tr><th>Cas</th><th>Exemple</th></tr>
<tr><td>Après and / but / or : le sujet commun est omis</td><td>She opened the door and (she) walked in.</td></tr>
<tr><td>Réponses courtes : on garde l'auxiliaire</td><td>Can you swim? — Yes, I can.</td></tr>
<tr><td>Comparaisons</td><td>He works harder than I do.</td></tr>
<tr><td>Après to : le verbe est omis</td><td>Do you want to come? — I'd love to. · You can come if you want to.</td></tr>
<tr><td>Après if / when / although + adjectif ou participe</td><td>If possible, call me back. · When asked, he refused. · Although tired, he kept working.</td></tr>
<tr><td>Après un auxiliaire dans un reproche</td><td>She didn't call, but she should have.</td></tr>
</table></div>

<h3>3. So, neither, nor (reprise de l'auxiliaire)</h3>
<div class="lc-box"><b>So + auxiliaire + sujet</b> (accord positif) : I can swim, and so can he. · I love jazz. — So do I.<br>
<b>Neither / Nor + auxiliaire + sujet</b> (accord négatif) : I didn't go, and neither did she. · I haven't seen it, and nor has she.</div>

<h3>4. Do / does / did et do so</h3>
<p><b>do</b> remplace un verbe et son complément : <i>He works harder than I do.</i> <b>do so</b> (formel) : <i>He asked me to leave, and I did so.</i> <b>do it / do that</b> pour une action : <i>I told him not to do it.</i></p>

<h3>5. One / ones</h3>
<div class="lc-t"><table>
<tr><th>Règle</th><th>Exemple</th></tr>
<tr><td><b>one</b> remplace un nom dénombrable <u>singulier</u></td><td>I like the red shirt, but I prefer the blue one.</td></tr>
<tr><td><b>ones</b> remplace un pluriel</td><td>Which cars do you like? — The big ones. · the ones I like</td></tr>
<tr><td>Jamais pour un indénombrable</td><td>I like red wine more than white (wine).</td></tr>
<tr><td>Jamais après un possessif seul : on utilise le pronom ; avec un adjectif, on peut</td><td>my red one · mine (✗ my one)</td></tr>
<tr><td>this one / that one / which one(s)</td><td>Which one do you prefer?</td></tr>
</table></div>

<h3>6. So et not après certains verbes</h3>
<p>Après <b>think, believe, expect, hope, suppose, imagine, guess, be afraid, seem, appear</b>, on remplace une proposition par <b>so</b> (affirmatif) ou <b>not</b> (négatif) :</p>
<div class="lc-t"><table>
<tr><th>Affirmatif</th><th>Négatif</th></tr>
<tr><td>I think so. · I hope so. · I'm afraid so.</td><td>I don't think so. · I hope not. · I'm afraid not. · I suppose not.</td></tr>
</table></div>
<p><b>if so / if not</b> : <i>Are you free? If so, come with us. If not, never mind.</i></p>
<div class="lc-warn">✗ <i>I think that yes</i> · ✗ <i>I hope no</i> · ✗ <i>I think it so</i> → ✓ <i>I think so · I hope not</i></div>

<h3>7. That of / those of</h3>
<p>Pour éviter de répéter un nom dans une comparaison : <i>The population of London is bigger than <b>that</b> of Paris. The streets of Rome are narrower than <b>those</b> of Paris.</i></p>

<h3>8. Such</h3>
<p><i>Such is life</i> (c'est la vie) · <i>the same</i> : <i>I'll have the same.</i></p>

<h3>1. La nominalisation</h3>
<p>Transformer un verbe ou un adjectif en <b>nom</b> permet de condenser l'information. C'est un trait majeur de l'écrit formel, académique, journalistique et professionnel.</p>
<div class="lc-box">The company <u>decided</u> to expand. → The company's <b>decision</b> to expand…<br>
Prices <u>rose</u>, so people bought less. → The <b>rise</b> in prices led to a <b>decrease</b> in purchases.</div>

<h3>2. Les terminaisons courantes</h3>
<div class="lc-t"><table>
<tr><th>Suffixe</th><th>Exemples</th></tr>
<tr><td>-tion / -sion</td><td>decide → decision · inform → information · discuss → discussion</td></tr>
<tr><td>-ment</td><td>develop → development · achieve → achievement · govern → government</td></tr>
<tr><td>-al</td><td>arrive → arrival · refuse → refusal · approve → approval</td></tr>
<tr><td>-ure</td><td>fail → failure · depart → departure · press → pressure</td></tr>
<tr><td>-ance / -ence</td><td>important → importance · differ → difference · appear → appearance</td></tr>
<tr><td>-ity / -ty / -y</td><td>able → ability · safe → safety · free → freedom (-dom) · strong → strength (-th)</td></tr>
<tr><td>-ness</td><td>happy → happiness · aware → awareness</td></tr>
</table></div>

<h3>3. Cadres de phrase typiques</h3>
<div class="lc-box">There has been a significant <b>increase / decrease / rise / fall / improvement</b> in unemployment.<br>
X <b>led to / resulted in / contributed to</b> Y. · The <b>impact / effect / influence</b> of X <b>on</b> Y.<br>
The <b>reason for</b> … · the <b>lack of</b> … · the <b>need for</b> …</div>
<div class="lc-warn">Attention aux prépositions : <i>the lack <b>of</b> funding · resulted <b>in</b> the closure · the impact <b>of</b> social media <b>on</b> young people.</i></div>

<h3>4. Verbe léger + nom</h3>
<p>Un verbe simple peut être remplacé par <b>verbe léger + nom</b>, plus soutenu : <i>investigate → carry out an investigation · decide → reach a decision · discuss → hold a discussion · help → provide assistance.</i></p>

<h3>5. Registre : formel, neutre, familier</h3>
<div class="lc-t"><table>
<tr><th>Familier / neutre</th><th>Formel</th><th>Familier / neutre</th><th>Formel</th></tr>
<tr><td>buy</td><td><b>purchase</b></td><td>start</td><td><b>commence</b></td></tr>
<tr><td>help</td><td><b>assist</b></td><td>enough</td><td><b>sufficient</b></td></tr>
<tr><td>ask</td><td><b>inquire / enquire</b></td><td>show</td><td><b>demonstrate</b></td></tr>
<tr><td>end</td><td><b>terminate</b></td><td>live</td><td><b>reside</b></td></tr>
<tr><td>need</td><td><b>require</b></td><td>tell</td><td><b>inform</b></td></tr>
<tr><td>get</td><td><b>obtain</b></td><td>try</td><td><b>endeavour</b></td></tr>
<tr><td>look into</td><td><b>investigate</b></td><td>a lot of</td><td><b>a great deal of / numerous</b></td></tr>
<tr><td>kids</td><td><b>children</b></td><td>about</td><td><b>approximately / regarding</b></td></tr>
</table></div>

<h3>6. Grammaire du style formel</h3>
<div class="lc-t"><table>
<tr><th>Moyen</th><th>Exemple</th></tr>
<tr><td>Passif et tournures impersonnelles</td><td>It is believed that the policy will fail.</td></tr>
<tr><td>Pas de contractions</td><td>cannot, do not, it is</td></tr>
<tr><td>Verbes simples plutôt que phrasal verbs</td><td>investigate (plutôt que look into)</td></tr>
<tr><td>Subjonctif, inversion</td><td>Should you require assistance… · It is essential that he be informed.</td></tr>
<tr><td>Connecteurs soutenus</td><td>moreover, nevertheless, consequently, whereas</td></tr>
</table></div>

<h3>7. Atténuer ses affirmations (hedging)</h3>
<p>À l'écrit académique, on nuance pour rester prudent : <i>The results <b>appear to</b> support the hypothesis. · Children <b>tend to</b> learn faster. · It <b>could be argued that</b>… · This <b>may</b> be due to… · to some extent, relatively, somewhat.</i> On évite les absolus (<i>always, never, totally, definitely</i>) et l'argot (<i>awesome, crazy, guys</i>).</p>

<h3>8. À ne pas faire</h3>
<div class="lc-warn">La nominalisation excessive alourdit le texte et masque l'agent. Gardez des phrases claires : nominalisez pour condenser, pas pour compliquer.</div>

<h3>6. Les collocations : verbe + nom</h3>
<p>Une collocation est une association naturelle de mots. On ne peut pas la remplacer par un synonyme : <i>make a decision</i> (pas <i>do a decision</i>).</p>

course: `
<p class="lc-hint">Dans cette leçon, les boutons 🔊 lisent l'exemple avec la voix choisie (UK / US, vitesse) dans l'onglet Vocabulaire. La synthèse vocale peut simplifier certaines réductions : écoute-la comme un repère, pas comme un modèle parfait.</p>

<h3>1. L'accent de mot</h3>
<p>En anglais, chaque mot de plus d'une syllabe a une syllabe <b>accentuée</b> : plus longue, plus forte, plus haute. Les autres sont <b>réduites</b>, souvent à un son neutre /ə/ (le <i>schwa</i>). Les majuscules ci-dessous marquent la syllabe accentuée.</p>
<div class="lc-t"><table>
<tr><th>Règle</th><th>Exemples</th></tr>
<tr><td>Noms et adjectifs de 2 syllabes : <b>1<sup>re</sup></b></td><td>TAble · HAPpy · PREsent (nom)</td></tr>
<tr><td>Verbes de 2 syllabes : <b>2<sup>e</sup></b></td><td>reLAX · deCIDE · preSENT (verbe)</td></tr>
<tr><td>Mots en <b>-tion, -sion, -ic, -ical, -ity, -ial, -ian</b> : syllabe <b>avant</b> la terminaison</td><td>eduCAtion · ecoNOMic · poLITical · aBILity</td></tr>
<tr><td>Mots en <b>-ee, -eer, -ese</b> : <b>sur la terminaison</b></td><td>refuGEE · engiNEER · JapaNESE</td></tr>
<tr><td>Famille de mots : l'accent <b>se déplace</b></td><td>PHOtograph · phoTOgraphy · photoGRAPHic</td></tr>
<tr><td>Nombres : -teen / -ty</td><td>thirTEEN (accent final) · THIRty (accent initial)</td></tr>
<tr><td>Noms composés : <b>1<sup>er</sup> élément</b></td><td>a GREENhouse (serre) ≠ a green HOUSE (maison verte)</td></tr>
</table></div>

<h3>2. Noms et verbes identiques : l'accent change</h3>
<div class="lc-t"><table>
<tr><th>Nom (accent sur la 1<sup>re</sup>)</th><th>Verbe (accent sur la 2<sup>e</sup>)</th></tr>
<tr><td>I have a PREsent for you. ${sp('I have a present for you.')}</td><td>I will preSENT the results. ${sp('I will present the results.')}</td></tr>
<tr><td>a REcord ${sp('This is a world record.')}</td><td>to reCORD ${sp('Please record the meeting.')}</td></tr>
<tr><td>an INcrease ${sp('There was a sharp increase in prices.')}</td><td>to inCREASE ${sp('Prices will increase next year.')}</td></tr>
<tr><td>an OBject ${sp('What is that object on the table?')}</td><td>to obJECT ${sp('I object to the new rule.')}</td></tr>
</table></div>

<h3>3. L'accent de phrase</h3>
<p>Dans une phrase, on accentue les <b>mots de contenu</b> (noms, verbes principaux, adjectifs, adverbes, mots négatifs, mots interrogatifs). Les <b>mots grammaticaux</b> (articles, prépositions, pronoms, auxiliaires, conjonctions) sont <b>faibles</b>. Le rythme de l'anglais est dit « stress-timed » : les syllabes accentuées reviennent à intervalles réguliers.</p>
<div class="lc-box">I'd <b>LIKE</b> a <b>CUP</b> of <b>TEA</b>. ${sp("I'd like a cup of tea.")}<br>
She <b>WENT</b> to the <b>SHOP</b> to <b>BUY</b> some <b>BREAD</b>. ${sp('She went to the shop to buy some bread.')}</div>

<h3>4. Les formes faibles</h3>
<p>Les mots grammaticaux ont deux formes : une forme <b>forte</b> (isolée ou accentuée) et une forme <b>faible</b> (en position normale).</p>
<div class="lc-t"><table>
<tr><th>Mot</th><th>Forme faible</th><th>Exemple</th></tr>
<tr><td>to</td><td>/tə/</td><td>I want to go. ${sp('I want to go.')}</td></tr>
<tr><td>of</td><td>/əv/</td><td>a cup of tea ${sp('a cup of tea')}</td></tr>
<tr><td>and</td><td>/ən/</td><td>fish and chips ${sp('fish and chips')}</td></tr>
<tr><td>can</td><td>/kən/ (forte /kæn/ en fin de phrase)</td><td>I can swim. ${sp('I can swim.')} · Yes, I can. ${sp('Yes, I can.')}</td></tr>
<tr><td>have (auxiliaire)</td><td>/əv/</td><td>should have gone ${sp('She should have gone.')}</td></tr>
<tr><td>the / a</td><td>/ðə/ · /ə/</td><td>the end of a story ${sp('the end of a story')}</td></tr>
</table></div>
<div class="lc-warn">Écrire <i>should of</i> est une erreur : c'est la prononciation faible de <i>should have</i> (/ʃʊd əv/).</div>

<h3>5. Liaison et réductions</h3>
<p>Les mots s'enchaînent : consonne finale + voyelle initiale se lient (<i>turn it on</i> ${sp('turn it on')}). À l'oral courant : <i>going to → gonna, want to → wanna, got to → gotta</i> (à reconnaître, pas à écrire).</p>

function showToast(msg) {
  var t = document.getElementById('toast-el');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function showTab(tab) {
  document.getElementById('page-flash').style.display = tab === 'flash' ? 'block' : 'none';
  document.getElementById('page-ex').style.display = tab === 'ex' ? 'block' : 'none';
  document.getElementById('page-lecons').style.display = tab === 'lecons' ? 'block' : 'none';
  document.getElementById('page-defi').style.display = tab === 'defi' ? 'block' : 'none';
  document.getElementById('bn-flash').classList.toggle('active', tab === 'flash');
  document.getElementById('bn-lecons').classList.toggle('active', tab === 'lecons' || tab === 'ex');
  document.getElementById('bn-defi').classList.toggle('active', tab === 'defi');
  if (tab !== 'defi') document.getElementById('defi-fixed-bar').style.display = 'none';
  if (tab !== 'lecons') document.getElementById('lc-fixed-bar').style.display = 'none';
  if (tab === 'lecons' && !lcCur) lcRenderList();
  if (tab === 'ex' && !exInited) { exInit(); exInited = true; }
  if (tab === 'defi') { defiInitTab(); }
}
